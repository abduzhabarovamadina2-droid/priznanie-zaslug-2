/* =========================================================================
   ПРАЗДНИЧНОЕ ОКНО «ВАМ НАПРАВИЛИ БЕЙДЖ»
   ========================================================================= */
.celeb{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px}
.celeb-bg{position:absolute;inset:0;background:rgba(3,9,7,.84);backdrop-filter:blur(7px);animation:fadeIn .35s ease both}
.celeb-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.celeb-card{
  position:relative;z-index:3;width:100%;max-width:470px;border-radius:28px;padding:30px 28px 26px;text-align:center;
  background:linear-gradient(180deg,#13261f 0%,#090f0d 100%);
  border:1px solid rgba(232,200,90,.3);
  box-shadow:0 48px 110px -34px rgba(0,0,0,.95), 0 0 70px -22px rgba(232,200,90,.45);
  animation:celebIn .85s cubic-bezier(.16,1.25,.3,1) both;
  transform-style:preserve-3d;
}
@keyframes celebIn{
  0%{opacity:0;transform:translateY(48px) scale(.72) rotateX(16deg)}
  55%{opacity:1}
  100%{opacity:1;transform:translateY(0) scale(1) rotateX(0)}
}
.celeb-close{position:absolute;top:14px;right:14px;z-index:5;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);transition:all .2s}
.celeb-close:hover{background:rgba(255,255,255,.1);color:#fff}
.celeb-sound{position:absolute;top:14px;right:54px;z-index:5;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);transition:all .2s}
.celeb-sound:hover{background:rgba(255,255,255,.1);color:#fff}
.celeb-sound[aria-pressed="true"]{color:rgba(240,214,122,.9)}
.celeb-sound[aria-pressed="true"]::after{content:"";position:absolute;inset:-3px;border-radius:12px;pointer-events:none;
  border:1px solid rgba(232,200,90,.35);animation:sndPulse 2s ease-out infinite}
@keyframes sndPulse{0%{transform:scale(.9);opacity:.9}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.celeb-sound[aria-pressed="true"]::after{animation:none;opacity:.5}}


.celeb-stage{position:relative;height:238px;margin-bottom:4px}
.celeb-halo{position:absolute;left:50%;top:50%;width:330px;height:330px;margin:-165px 0 0 -165px;pointer-events:none;z-index:0}
.celeb-rays{
  position:absolute;inset:0;border-radius:50%;opacity:.5;filter:blur(.6px);
  background:conic-gradient(from 0deg,
    rgba(232,200,90,.34) 0deg 9deg, transparent 9deg 30deg,
    rgba(52,211,153,.26) 30deg 39deg, transparent 39deg 60deg);
  animation:raySpin 16s linear infinite;
  -webkit-mask-image:radial-gradient(closest-side, #000 30%, transparent 78%);
  mask-image:radial-gradient(closest-side, #000 30%, transparent 78%);
}
@keyframes raySpin{to{transform:rotate(360deg)}}
.celeb-glowpool{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(closest-side, rgba(232,200,90,.34), transparent 70%);
  animation:poolPulse 2.8s ease-in-out infinite}
@keyframes poolPulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:.95;transform:scale(1.06)}}
.celeb-ring{
  position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  border:2px solid rgba(232,200,90,.55);animation:ringPop 2.8s cubic-bezier(.2,.7,.3,1) infinite;
}
.celeb-ring.r2{animation-delay:.9s;border-color:rgba(52,211,153,.5)}
.celeb-ring.r3{animation-delay:1.8s;border-color:rgba(255,255,255,.3)}
@keyframes ringPop{0%{transform:scale(.45);opacity:.85}100%{transform:scale(2.5);opacity:0}}

.celeb-badge{position:relative;z-index:1;width:208px;margin:0 auto;animation:badgeFloat 3.6s ease-in-out .9s infinite}
@keyframes badgeFloat{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-11px) rotate(1.6deg)}}
.celeb-badge .badge-svg{max-width:208px}
.celeb-badge .brotate{animation:badgeSpin 1.35s cubic-bezier(.18,.9,.22,1) both}
@keyframes badgeSpin{from{transform:rotate(-200deg) scale(.55)}to{transform:rotate(0) scale(1)}}
/* эмблема внутри бейджа: лёгкое дыхание и всплеск в момент появления */
.celeb-badge image{animation:embPop 1.1s cubic-bezier(.2,1.4,.3,1) both, embBreath 3.2s ease-in-out 1.4s infinite;
  transform-box:fill-box;transform-origin:center}
@keyframes embPop{0%{opacity:0;transform:scale(.2) rotate(-40deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes embBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

.celeb-kicker{
  display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;
  font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:#2a1f00;background:linear-gradient(135deg,#f7e79f,#e8c85a 45%,#c9a227);
  box-shadow:0 8px 22px -8px rgba(201,162,39,.85);
}
.celeb-title{font-size:26px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-top:12px}
.celeb-badgename{font-size:16px;font-weight:700;margin-top:8px;
  background:linear-gradient(100deg,#f7e79f,#e8c85a,#fff,#e8c85a);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:goldSweep 3.6s linear infinite}
@keyframes goldSweep{to{background-position:-220% 0}}
.celeb-desc{font-size:13px;color:rgba(255,255,255,.6);font-style:italic;margin-top:3px}
.celeb-from{
  display:flex;align-items:center;gap:12px;text-align:left;margin-top:20px;padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
}
.celeb-from .ava{width:42px;height:42px;border-radius:50%;flex-shrink:0;color:#fff;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#34d399,#0a5c40)}
.celeb-from .nm{font-size:13.5px;font-weight:700;color:#fff}
.celeb-from .rl{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:2px}
.celeb-reason{margin-top:12px;padding:14px 16px;border-radius:14px;text-align:left;font-size:13px;line-height:1.6;
  color:rgba(255,255,255,.78);background:rgba(232,200,90,.07);border:1px solid rgba(232,200,90,.18)}
.celeb-reason b{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(232,200,90,.85);margin-bottom:6px;font-weight:800}
.celeb-actions{display:flex;gap:10px;margin-top:20px}
.celeb-btn{flex:1;height:44px;border-radius:14px;font-size:13.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.celeb-btn.main{color:#2a1f00;background:linear-gradient(135deg,#f7e79f,#e8c85a 45%,#c9a227);
  box-shadow:0 10px 26px -10px rgba(201,162,39,.9)}
.celeb-btn.main:hover{filter:brightness(1.07);transform:translateY(-1.5px)}
.celeb-btn.ghost2{color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.16)}
.celeb-btn.ghost2:hover{background:rgba(255,255,255,.07);color:#fff}
.celeb-line{opacity:0;animation:lineUp .6s ease both}
@keyframes lineUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .celeb-card,.celeb-badge,.celeb-badge .brotate,.celeb-badge image,.celeb-rays,.celeb-ring,
  .celeb-glowpool,.celeb-badgename,.celeb-line{animation:none!important;opacity:1!important;transform:none!important}
}

/* ---- кнопка «Мои награды» ---- */
.gl-award{
  margin-left:auto;color:#fff;
  background:radial-gradient(circle at 34% 28%,#fff8d8 0%,#f6d873 46%,#e0a91d 100%);
  border:1px solid rgba(255,244,200,.9);
  box-shadow:0 0 0 2px rgba(255,214,90,.26),0 0 14px 2px rgba(255,199,60,.5),
             inset 0 1px 2px rgba(255,255,255,.9),0 4px 12px rgba(0,0,0,.25);
  animation:awardGlow 2.2s ease-in-out infinite;
}
.gl-award svg{filter:drop-shadow(0 1px 1.5px rgba(90,60,0,.55))}
.gl-award::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;
  border:1.5px solid rgba(255,214,90,.75);animation:awardRing 2.2s ease-out infinite;
}
.gl-award:hover{transform:translateY(-1.5px) scale(1.07);animation-play-state:paused}
.gl-award:hover::after{animation-play-state:paused;opacity:0}
@keyframes awardGlow{
  0%,100%{box-shadow:0 0 0 2px rgba(255,214,90,.26),0 0 14px 2px rgba(255,199,60,.5),
          inset 0 1px 2px rgba(255,255,255,.9),0 4px 12px rgba(0,0,0,.25)}
  50%{box-shadow:0 0 0 3px rgba(255,214,90,.42),0 0 24px 6px rgba(255,199,60,.85),
      inset 0 1px 2px rgba(255,255,255,.9),0 4px 12px rgba(0,0,0,.25)}
}
@keyframes awardRing{
  0%{transform:scale(.9);opacity:.85}
  70%{transform:scale(1.45);opacity:0}
  100%{transform:scale(1.45);opacity:0}
}
@media(prefers-reduced-motion:reduce){
  .gl-award,.gl-award::after{animation:none}
}

/* ---- выпадающие уведомления в верхней панели ---- */

  border-radius:var(--r-lg);overflow:hidden;background:#fff;border:1px solid var(--line);
  box-shadow:0 24px 48px -20px rgba(0,0,0,.55),0 0 0 1px rgba(20,162,96,.14)}

.gl-notif-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.gl-notif-h > span{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--txt)}
.gl-notif-h i{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ok);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.gl-notif-h button{font-size:11.5px;font-weight:600;color:var(--ok-text);transition:opacity .18s}
.gl-notif-h button:hover{opacity:.72}
.gl-notif-list{max-height:340px;overflow-y:auto}
.gl-notif-i{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line-soft);transition:background .16s}
.gl-notif-i:last-child{border-bottom:none}
.gl-notif-i:hover{background:var(--row-hover)}
.gl-notif-i.unread{background:var(--ok-soft)}

.gl-notif-ic{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;

.gl-notif-x{font-size:11.5px;line-height:1.5;color:var(--muted)}
.gl-notif-d{font-size:10.5px;color:var(--faint);margin-top:2px}
.gl-notif-e{padding:32px 16px;text-align:center;font-size:12.5px;color:var(--faint)}
.gl-notif-f{padding:11px 16px;border-top:1px solid var(--line);background:var(--surface-2);font-size:10.5px;line-height:1.5;color:var(--faint)}
@media(max-width:520px){.gl-notif{right:0;width:calc(100vw - 32px)}}

.mr-rating{display:flex;flex-direction:column;gap:16px}

@keyframes growBar{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
.kpi-value.sm{font-size:15px;line-height:1.35}
tbody tr.mr-me{background:var(--ok-soft)}
tbody tr.mr-me td{font-weight:700}

@media(max-width:900px){

/* =========================================================================
   АВТОРИЗАЦИЯ, АДМИНИСТРИРОВАНИЕ, СПРАВОЧНИКИ (по ДТЗ «Администрирование»)
   ========================================================================= */
.mr-login{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.mr-login-bg{position:absolute;inset:0;background:
  radial-gradient(1000px 560px at 18% 12%, rgba(20,220,140,.20), transparent 62%),
  radial-gradient(900px 520px at 84% 84%, rgba(13,69,48,.55), transparent 60%),
  linear-gradient(150deg,#061410 0%,#07100d 48%,#04100b 100%)}
html:not(.dark) .mr-login-bg{background:
  radial-gradient(1000px 560px at 18% 12%, rgba(20,162,96,.18), transparent 62%),
  radial-gradient(900px 520px at 84% 84%, rgba(20,220,140,.14), transparent 60%),
  linear-gradient(150deg,#eef5f1 0%,#f4f8f5 100%)}
.mr-login-card{position:relative;width:100%;max-width:456px;display:flex;flex-direction:column;gap:14px;
  padding:26px;border-radius:var(--r-lg);background:var(--surface);backdrop-filter:var(--blur);
  border:1px solid var(--line);box-shadow:0 30px 70px -28px rgba(0,0,0,.7),0 0 0 1px rgba(20,162,96,.16)}
html.dark .mr-login-card{background:rgba(10,21,17,.9)}
.mr-login-head{display:flex;align-items:center;gap:12px;padding-bottom:4px}
.mr-login-mark{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--brand-1),var(--brand-2));box-shadow:0 8px 20px -10px rgba(16,185,129,.9)}
.mr-login-t{font-size:18px;font-weight:800;letter-spacing:-.02em}
.mr-login-s{font-size:11.5px;color:var(--faint);margin-top:2px}
.mr-login-f{display:flex;flex-direction:column;gap:6px}
.mr-login-f > span{font-size:12px;font-weight:700;color:var(--muted)}
.mr-login-f input{width:100%;height:44px;padding:0 14px;border-radius:var(--r);font-size:13.5px;font-family:inherit;
  background:var(--field);border:1px solid var(--field-line);color:var(--txt);transition:border-color .2s,box-shadow .2s}
.mr-login-f input:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--ring-focus)}
.mr-login-pw{position:relative;display:block}
.mr-login-pw input{padding-right:88px}
.mr-login-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;color:var(--ok-text)}
.mr-login-go{width:100%;justify-content:center;display:flex;align-items:center;gap:8px;margin-top:2px}
.mr-login-demo{margin-top:4px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:7px}
.mr-login-demo-t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.mr-login-u{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 11px;border-radius:var(--r);
  background:var(--surface-2);border:1px solid var(--line);transition:all .18s}
.mr-login-u:hover{border-color:rgba(52,211,153,.45);background:var(--ok-soft)}
.mr-login-ub{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mr-login-ub b{font-size:12.5px;font-weight:700}
.mr-login-ub i{font-style:normal;font-size:10.5px;color:var(--faint)}
.mr-login-u code{font-family:var(--mono);font-size:10.5px;color:var(--ok-text);white-space:nowrap}

.mr-ph{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;
  border-radius:50%;display:block}
.mr-ava,.mr-win-ava,.mr-bd-ava{position:relative;overflow:hidden}
.mr-demo-banner{position:fixed;left:0;right:0;bottom:0;z-index:9999;
  padding:9px 16px;text-align:center;font-size:12.5px;line-height:1.45;
  color:var(--warn-text);background:var(--surface);
  border-top:2px solid var(--warn);box-shadow:var(--shadow)}
.mr-demo-banner b{font-weight:800;color:var(--warn)}
.lk-ava-img{width:104px;height:104px;border-radius:50%;object-fit:cover;display:block}
.mr-ava{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;letter-spacing:.02em;background:linear-gradient(145deg,var(--brand-1),var(--brand-2));
  box-shadow:0 2px 8px -2px rgba(0,0,0,.5)}

.mr-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mr-form-r{display:flex;flex-direction:column;gap:6px;min-width:0}
.mr-form-r.wide{grid-column:1 / -1}
.mr-form-r > span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.mr-form-r input,.mr-form-r select,.mr-form-r textarea{width:100%;border-radius:var(--r-sm);font-size:12.5px;font-family:inherit;
  background:var(--field);border:1px solid var(--field-line);color:var(--txt);padding:9px 12px;transition:border-color .2s,box-shadow .2s}
.mr-form-r textarea{min-height:74px;resize:vertical;line-height:1.5}
.mr-form-r input:focus,.mr-form-r select:focus,.mr-form-r textarea:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--ring-focus)}
.mr-form-r input[readonly]{color:var(--muted);cursor:default}
.mr-form-r select:disabled,.mr-form-r textarea:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:820px){.mr-form{grid-template-columns:1fr}}

.mr-hub{display:flex;flex-direction:column;gap:16px}
.mr-hub-t{font-size:15px;font-weight:700}
.mr-hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mr-hub-c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:148px;padding:22px;
  border-radius:var(--r-lg);color:#fff;text-align:center;
  background:linear-gradient(140deg,var(--brand-3) 0%,var(--brand-2) 60%,#0a2e20 100%);
  border:1px solid rgba(85,255,178,.28);box-shadow:0 14px 30px -18px rgba(0,0,0,.8);transition:transform .2s,box-shadow .2s}
.mr-hub-c:hover{transform:translateY(-3px);box-shadow:0 20px 38px -18px rgba(16,185,129,.65)}
.mr-hub-i{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26)}
.mr-hub-l{font-size:15px;font-weight:700;letter-spacing:-.01em}
.mr-hub-n{font-size:11px;color:rgba(236,253,245,.72)}
@media(max-width:900px){.mr-hub-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.mr-hub-grid{grid-template-columns:1fr}}

.mr-rowbtns{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mr-badge-dot{display:block;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 1px 2px rgba(255,255,255,.7),0 2px 6px rgba(0,0,0,.35)}
.act.mr-del:hover{background:var(--bad-soft);color:var(--bad)}
.fld .mr-input.sm{max-width:180px}
.mr-file{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mr-file input{font-size:12px;color:var(--muted)}

/* =========================================================================
   РЕЙТИНГ — статистика, пьедестал, распределение по номинациям
   ========================================================================= */
.mr-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mr-stat{position:relative;overflow:hidden;padding:18px 18px 16px;border-radius:var(--r-lg);
  background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
.mr-stat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--ok),transparent 78%);opacity:.7}
.mr-stat-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mr-stat-h > span{font-size:11.5px;font-weight:600;color:var(--muted)}
.mr-stat-h i{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--ok-soft);color:var(--ok-text)}
.mr-stat-v{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:10px;
  font-variant-numeric:tabular-nums}
.mr-stat-s{font-size:11px;color:var(--faint);margin-top:4px}

/* ---- пьедестал ---- */
.mr-podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;margin-top:4px}
.mr-pod{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.mr-pod-card{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:18px 14px 16px;
  border-radius:var(--r-lg) var(--r-lg) 0 0;border:1px solid var(--line);border-bottom:none;
  background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.mr-pod-ava{position:relative;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--brand-1),var(--brand-2));margin-bottom:4px}
.mr-pod-medal{position:absolute;right:-5px;bottom:-4px;width:23px;height:23px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;color:#3a2a03;
  border:2px solid var(--surface)}
.mr-pod-fio{font-size:13px;font-weight:700;line-height:1.35}
.mr-pod-dept{font-size:10.5px;color:var(--faint);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mr-pod-pts{display:flex;align-items:baseline;gap:5px;margin-top:5px}
.mr-pod-pts b{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--ok-text);font-variant-numeric:tabular-nums}
.mr-pod-pts span{font-size:11px;color:var(--muted)}
.mr-pod-badges{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);
  padding:4px 10px;border-radius:99px;background:var(--ok-soft)}
.mr-pod-base{display:flex;align-items:center;justify-content:center;border-radius:0 0 6px 6px;overflow:hidden}
.mr-pod-base span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:rgba(35,25,0,.62);white-space:nowrap}
.mr-pod.p1 .mr-pod-base{background:linear-gradient(180deg,#fbe9a4,#e0a91d)}
.mr-pod.p2 .mr-pod-base{background:linear-gradient(180deg,#eef1f3,#b7bfc4)}
.mr-pod.p3 .mr-pod-base{background:linear-gradient(180deg,#f0cfae,#c88742)}
.mr-pod.p1 .mr-pod-medal{background:linear-gradient(145deg,#fbe9a4,#e0a91d)}
.mr-pod.p2 .mr-pod-medal{background:linear-gradient(145deg,#eef1f3,#b7bfc4)}
.mr-pod.p3 .mr-pod-medal{background:linear-gradient(145deg,#f0cfae,#c88742)}
.mr-pod.p1 .mr-pod-card{border-color:rgba(224,169,29,.4);box-shadow:0 -10px 34px -22px rgba(224,169,29,.9)}
@media(max-width:820px){
  .mr-podium{grid-template-columns:1fr;align-items:stretch}
  .mr-pod.p1{order:1}.mr-pod.p2{order:2}.mr-pod.p3{order:3}
  .mr-pod-base{height:34px !important}
}

/* ---- распределение по номинациям ---- */
.mr-bars{display:flex;flex-direction:column;gap:4px}
.mr-bar{position:relative;display:grid;grid-template-columns:minmax(215px,1.1fr) 2.6fr 78px;align-items:center;gap:14px;
  padding:7px 10px;margin:0 -10px;border-radius:var(--r-sm);transition:background .16s}
.mr-bar:hover{background:var(--row-hover)}
.mr-bar-l{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--txt);min-width:0}
.mr-bar-l > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-badge-dot.sm{width:18px;height:18px;flex-shrink:0}
.mr-bar-t{height:10px;border-radius:4px;background:var(--track);overflow:hidden}
.mr-bar-t i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ok),var(--brand-1) 70%,var(--brand-2));
  transform-origin:left;animation:growBar .8s cubic-bezier(.22,1,.36,1) both}
.mr-bar:hover .mr-bar-t i{filter:brightness(1.15)}
.mr-bar-v{display:flex;align-items:baseline;justify-content:flex-end;gap:6px}
.mr-bar-v b{font-size:14px;font-weight:800;color:var(--ok-text);font-variant-numeric:tabular-nums}
.mr-bar-v i{font-style:normal;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.mr-bar-tip{position:absolute;left:200px;bottom:calc(100% - 2px);z-index:20;padding:8px 11px;border-radius:var(--r-sm);
  font-size:11.5px;font-weight:600;white-space:nowrap;pointer-events:none;
  color:var(--txt);background:var(--surface);border:1px solid var(--line);
  box-shadow:0 14px 30px -14px rgba(0,0,0,.7);animation:scaleIn .14s ease both}
html.dark .mr-bar-tip{background:rgba(9,19,15,.98)}
@media(max-width:820px){
  .mr-bar{grid-template-columns:1fr auto;gap:6px 10px}
  .mr-bar-t{grid-column:1 / -1}
  .mr-bar-tip{left:0;white-space:normal;max-width:min(320px,90vw)}
}

/* ---- таблица рейтинга ---- */
.mr-rank{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
  font-size:12px;font-weight:800;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);
  font-variant-numeric:tabular-nums}
.mr-rank.m1{color:#3a2a03;background:linear-gradient(145deg,#fbe9a4,#e0a91d);border-color:rgba(224,169,29,.5)}
.mr-rank.m2{color:#2b3033;background:linear-gradient(145deg,#eef1f3,#b7bfc4);border-color:rgba(183,191,196,.55)}
.mr-rank.m3{color:#3d2609;background:linear-gradient(145deg,#f0cfae,#c88742);border-color:rgba(200,135,66,.5)}
.mr-cellname{display:flex;align-items:center;gap:10px;min-width:0}
.mr-cellname b{font-size:13px;font-weight:700}
.mr-meter{position:relative;display:flex;align-items:center;height:22px;border-radius:4px;background:var(--track);overflow:hidden}
.mr-meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;
  background:linear-gradient(90deg,rgba(16,185,129,.55),rgba(20,162,96,.35))}
.mr-meter b{position:relative;z-index:1;padding:0 9px;font-size:12px;font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums}
.mr-bcount{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
  font-size:12px;font-weight:700;color:var(--ok-text);background:var(--ok-soft)}
@media(max-width:1100px){.mr-stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.mr-stats{grid-template-columns:1fr}}

/* =========================================================================
   ОТЧЁТ «РЕЙТИНГ» + КАРТОЧКА «ПРОСМОТР БЛАГОДАРНОСТЕЙ»
   ========================================================================= */
.mr-pod-card{width:100%;text-align:center;cursor:pointer;transition:transform .18s,border-color .18s}
.mr-pod-card:hover{transform:translateY(-3px);border-color:rgba(52,211,153,.5)}

.mr-rtable{min-width:1500px}
.mr-rtable tbody tr{cursor:pointer}
.mr-bh{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mr-badge-dot.xs{width:13px;height:13px;flex-shrink:0}
.mr-score{display:inline-flex;align-items:center;justify-content:center;min-width:56px;padding:5px 10px;border-radius:6px;
  font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;
  color:#4a3405;background:linear-gradient(145deg,#fbe9a4,#f2d777);box-shadow:inset 0 0 0 1px rgba(224,169,29,.45)}
.mr-bnum{text-align:center;font-variant-numeric:tabular-nums;color:var(--faint);font-weight:600}
.mr-bnum.has{color:var(--ok-text);font-weight:800}

/* ---- модальное окно просмотра ---- */
.modal.wide{max-width:1120px;width:min(1120px,96vw)}
.modal.wide .modal-body{display:flex;flex-direction:column;gap:16px}
.mr-sheet{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.mr-sheet.ok{border-color:rgba(16,185,129,.34)}
.mr-sheet.warn{border-color:rgba(245,158,11,.34)}
.mr-sheet-h{padding:9px 14px;font-size:12px;font-weight:700}
.mr-sheet.ok .mr-sheet-h{color:var(--ok-text);background:var(--ok-soft)}
.mr-sheet.warn .mr-sheet-h{color:var(--warn-text);background:var(--warn-soft)}
.mr-sheet-b{overflow-x:auto;background:var(--surface)}
html.dark .mr-sheet-b{background:rgba(9,19,15,.55)}
.mr-gtable{width:100%;min-width:940px;text-align:left}
.mr-gtable th{padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);white-space:nowrap}
.mr-gtable td{padding:10px 12px;font-size:12px;line-height:1.5;vertical-align:middle}
.mr-gtable tbody tr{cursor:default}
.mr-gtable tbody tr:hover{background:var(--row-hover)}
.mr-gtable .num{color:var(--faint);font-variant-numeric:tabular-nums}
.mr-gtable .empty{padding:26px 12px;font-size:12.5px}

.mr-grants-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2)}
.mr-gf-who{display:flex;align-items:center;gap:10px;font-size:13px}
.mr-gf-who b{font-weight:700}
.mr-gf-fine{font-size:11.5px;color:var(--warn-text);font-weight:600}
.mr-gf-rate{display:flex;align-items:baseline;gap:8px;margin-left:auto}
.mr-gf-rate span{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.mr-gf-rate b{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ok-text);font-variant-numeric:tabular-nums}
@media(max-width:640px){.mr-gf-rate{margin-left:0}}

/* иконка награды в неактивном состоянии — наград ещё нет */
.gl-award.off{
  color:rgba(255,255,255,.42);
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:none;
  animation:none;
  cursor:not-allowed;
  opacity:.75;
}
.gl-award.off::after{display:none}
.gl-award.off svg{filter:none}
.gl-award.off:hover{transform:none;background:rgba(255,255,255,.10)}
/* бейдж внутри карточки награды */
.trophy-badge{overflow:visible}
.trophy-badge .bglow{opacity:.55}
/* подпись уровня бейджа в углу карточки не выводим */
.badge-tier{display:none}

/* рейтинг ещё не сформирован */
.mr-norate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  padding:38px 20px;border-radius:var(--r-lg);border:1px dashed var(--line);background:var(--surface-2)}
.mr-norate-i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--ok-soft);color:var(--ok-text)}
.mr-norate b{font-size:14px;font-weight:700}
.mr-norate i{font-style:normal;font-size:12px;color:var(--faint);max-width:420px;line-height:1.5}
tbody tr.mr-norank td{opacity:.62}
.mr-rank.none{color:var(--faint);background:transparent;border-style:dashed}
/* выбор учётной записи из списка */
.mr-login-f select{width:100%;height:44px;padding:0 12px;border-radius:var(--r);font-size:13px;font-family:inherit;cursor:pointer;
  background:var(--field);border:1px solid var(--field-line);color:var(--txt);transition:border-color .2s,box-shadow .2s}
.mr-login-f select:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--ring-focus)}
.mr-login-who{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r);
  background:var(--ok-soft);border:1px solid rgba(52,211,153,.28)}
.mr-login-wb{display:flex;flex-direction:column;gap:2px;min-width:0}
.mr-login-wb b{font-size:13px;font-weight:700}
.mr-login-wb i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--ok-text)}
.mr-login-wb u{text-decoration:none;font-size:10.5px;color:var(--faint);line-height:1.4}
.mr-login-note{margin-top:2px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:10.5px;line-height:1.5;color:var(--faint)}
.mr-login-reset{display:block;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--bad-text);
  text-decoration:underline;text-underline-offset:2px;transition:opacity .18s}
.mr-login-reset:hover{opacity:.7}
/* =========================================================================
   РЕЕСТР ОТЧЁТНОСТИ МФЦА
   ========================================================================= */
.mr-reports{display:flex;flex-direction:column;gap:16px}
.mr-rep-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mr-rep-title{font-size:20px;font-weight:800;letter-spacing:-.02em}
.mr-rep-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;
  padding:18px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line)}
.mr-rep-filters input{height:40px;padding:0 13px;border-radius:var(--r-sm);font-size:12.5px;font-family:inherit;
  background:var(--surface);border:1px solid var(--field-line);color:var(--txt);transition:border-color .2s,box-shadow .2s}
.mr-rep-filters input::placeholder{color:var(--faint)}
.mr-rep-filters input:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--ring-focus)}
.mr-rep-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mr-rep-count{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.mr-rep-count b{font-size:16px;font-weight:800;color:var(--txt)}
.mr-rep-sel{font-size:11.5px;font-weight:700;color:var(--ok-text);padding:3px 9px;border-radius:99px;background:var(--ok-soft)}
.mr-rep-acts{display:flex;align-items:center;gap:10px}
.mr-xls{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:var(--r-sm);
  color:var(--ok-text);background:var(--ok-soft);border:1px solid rgba(52,211,153,.28);transition:all .18s}
.mr-xls:hover{background:var(--ok);color:#fff;border-color:transparent;transform:translateY(-1px)}
.mr-xls.sm{width:32px;height:32px;margin:0 auto}
.mr-rep-table{min-width:1240px}
.mr-rep-table tbody tr{cursor:default}
.mr-rep-table tr.mr-rep-on{background:var(--ok-soft)}
.mr-rep-table th{text-align:center}
.mr-rep-table th:nth-child(5),.mr-rep-table th:nth-child(7){text-align:left}
.mr-rep-table td{text-align:center;font-size:12px}
.mr-rep-table td.mr-org,.mr-rep-table td.mr-repname{text-align:left}
.mr-org{font-size:12px;line-height:1.45;color:var(--ok-text);font-weight:600}
.mr-repname{font-size:12px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-two{white-space:pre-line}
.mr-check{width:16px;height:16px;accent-color:var(--brand-1);cursor:pointer;vertical-align:middle}
.mr-valid{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  color:#fff;background:var(--ok)}
.mr-valid.bad{background:var(--bad)}
.mr-rep-foot{font-size:12px;color:var(--faint)}
.mr-hub-head{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
@media(max-width:1100px){.mr-rep-filters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.mr-rep-filters{grid-template-columns:1fr}}
/* =========================================================================
   ГЛАВНАЯ: галерея победителей, погода, дни рождения, стратегическая карта
   ========================================================================= */
.mr-home{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.mr-home-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.mr-home-rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
@media(max-width:1180px){.mr-home{grid-template-columns:1fr}.mr-home-rail{position:static}}

/* ---- галерея победителей ---- */
.mr-gal{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);backdrop-filter:var(--blur);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.mr-gal-head{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 18px;background:linear-gradient(140deg,var(--brand-3) 0%,var(--brand-2) 60%,#0a2e20 100%)}
.mr-gal-head h2{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em;
  text-shadow:0 1px 4px rgba(0,0,0,.3)}
.mr-gal-sheen{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.22) 46%,rgba(255,255,255,.05) 53%,transparent 66%);
  background-size:230% 100%;animation:navSheen 6.5s ease-in-out infinite}
.mr-gal-more{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;flex-shrink:0;
  font-size:11.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  transition:all .18s}
.mr-gal-more:hover{background:rgba(255,255,255,.28);transform:translateX(2px)}
.mr-gal-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:12px}
.mr-gal-sub{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.01em}
.mr-gal-sub i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mr-gal-sub.ca{color:var(--info-text)} .mr-gal-sub.ca i{background:var(--info);box-shadow:0 0 8px var(--info)}
.mr-gal-sub.br{color:var(--warn-text);margin-top:6px} .mr-gal-sub.br i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.mr-gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}

.mr-win{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:14px 10px 12px;
  border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);
  opacity:0;transition:transform .22s,border-color .22s,box-shadow .22s}
.mr-gal-grid.in .mr-win{animation:winIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes winIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.mr-win:hover{transform:translateY(-4px);border-color:rgba(52,211,153,.45);box-shadow:0 16px 30px -18px rgba(16,185,129,.8)}
.mr-win-ph{position:relative;width:60px;height:60px;margin-bottom:7px;flex-shrink:0}
.mr-win-ava{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;letter-spacing:.02em;
  background:linear-gradient(145deg,var(--brand-1),var(--brand-2));box-shadow:0 6px 16px -8px rgba(0,0,0,.7)}
.mr-win-ring{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(52,211,153,.35);
  opacity:0;transition:opacity .22s,transform .22s}
.mr-win:hover .mr-win-ring{opacity:1;transform:scale(1.06)}
.mr-win-medal{position:absolute;right:-3px;bottom:-2px;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;
  color:#3a2a03;border:2px solid var(--surface-2)}
.mr-win.m1 .mr-win-medal{background:linear-gradient(145deg,#fbe9a4,#e0a91d)}
.mr-win.m2 .mr-win-medal{background:linear-gradient(145deg,#eef1f3,#b7bfc4);color:#2b3033}
.mr-win.m3 .mr-win-medal{background:linear-gradient(145deg,#f0cfae,#c88742);color:#3d2609}
.mr-win.m1{border-color:rgba(224,169,29,.42)}
.mr-win.m1 .mr-win-ava{box-shadow:0 0 0 2px rgba(224,169,29,.5),0 6px 18px -8px rgba(224,169,29,.9)}
.mr-win-fio{font-size:12.5px;font-weight:700;line-height:1.35}
.mr-win-post{font-size:10.5px;color:var(--muted);line-height:1.4}
.mr-win-dep{font-size:10px;font-weight:700;color:var(--ok-text);margin-top:2px}

/* ---- стратегическая карта ---- */
.mr-smap{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);backdrop-filter:var(--blur);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.mr-smap-head{display:flex;align-items:center;gap:9px;padding:13px 18px;font-size:12.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ok-text);background:var(--surface-2);
  border-bottom:1px solid var(--line)}
.mr-smap-table{min-width:760px}
.mr-smap-table th{text-align:center}
.mr-smap-table th:first-child{text-align:left}

/* ---- погода ---- */
.mr-wx{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:16px;color:#fff;
  background:linear-gradient(160deg,#2f8fd8 0%,#1f6fb8 52%,#17548d 100%);
  box-shadow:0 16px 34px -20px rgba(23,84,141,.95)}
.mr-wx-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mr-wx-lbl{display:block;font-size:10px;text-transform:lowercase;color:rgba(255,255,255,.72)}
.mr-wx-city{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.mr-wx-now{display:flex;align-items:flex-end;gap:12px;margin-top:6px}
.mr-wx-deg{font-size:44px;font-weight:300;line-height:1;letter-spacing:-.03em}
.mr-wx-meta{display:flex;flex-direction:column;gap:3px;padding-bottom:5px;font-size:11.5px;color:rgba(255,255,255,.86)}
.mr-wx-wind{display:inline-flex;align-items:center;gap:5px}
.mr-wx-days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.2)}
.mr-wx-day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:10px;
  background:rgba(255,255,255,.1);animation:winIn .5s cubic-bezier(.22,1,.36,1) both}
.mr-wx-dn{font-size:9px;color:rgba(255,255,255,.78);text-align:center;line-height:1.2}
.mr-wx-hi{font-size:14px;font-weight:700}
.mr-wx-lo{font-size:11px;color:rgba(255,255,255,.62)}

.mr-sun{position:relative;display:inline-flex;width:30px;height:30px;flex-shrink:0}
.mr-wx-top .mr-sun{width:46px;height:46px}
.mr-sun-core{position:absolute;left:50%;top:50%;width:52%;height:52%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff6c9,#ffd34d 60%,#f5a623);
  box-shadow:0 0 12px rgba(255,206,77,.8)}
.mr-sun-rays{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,220,120,.85) 0 6deg,transparent 6deg 30deg);
  -webkit-mask:radial-gradient(circle,transparent 0 36%,#000 38%);mask:radial-gradient(circle,transparent 0 36%,#000 38%);
  animation:sunSpin 14s linear infinite}
@keyframes sunSpin{to{transform:rotate(360deg)}}
.mr-sun-cloud{position:absolute;right:-2px;bottom:0;width:66%;height:42%;border-radius:99px;
  background:linear-gradient(180deg,#fff,#dbe7f2);box-shadow:0 2px 6px rgba(0,0,0,.2)}
@media(prefers-reduced-motion:reduce){.mr-sun-rays,.mr-gal-sheen{animation:none}}

/* ---- промо-блок ---- */
.mr-promo{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:7px;
  padding:18px;border-radius:var(--r-lg);background:var(--surface);backdrop-filter:var(--blur);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.mr-promo-glow{position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(20,220,140,.28),transparent 68%);animation:navBreathe 5s ease-in-out infinite}
.mr-promo-ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  color:#4a3405;background:radial-gradient(circle at 34% 28%,#fff8d8,#f6d873 46%,#e0a91d);
  box-shadow:0 8px 20px -10px rgba(224,169,29,.95)}
.mr-promo b{font-size:14px;font-weight:800;letter-spacing:-.01em}
.mr-promo i{font-style:normal;font-size:11.5px;line-height:1.5;color:var(--muted)}
.mr-promo-btn{display:inline-flex;align-items:center;gap:7px;margin-top:4px;height:36px;padding:0 15px;border-radius:99px;
  font-size:12px;font-weight:700;color:#fff;background:linear-gradient(100deg,var(--brand-1),var(--brand-2));
  box-shadow:0 8px 18px -8px rgba(16,185,129,.85);transition:filter .18s,transform .18s}
.mr-promo-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}

/* ---- дни рождения ---- */
.mr-bd{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);backdrop-filter:var(--blur);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.mr-bd-head{display:flex;align-items:center;gap:9px;padding:12px 16px;font-size:12.5px;font-weight:800;color:#fff;
  background:linear-gradient(140deg,var(--brand-3) 0%,var(--brand-2) 60%,#0a2e20 100%)}
.mr-bd-list{max-height:330px;overflow-y:auto}
.mr-bd-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft);
  animation:winIn .45s cubic-bezier(.22,1,.36,1) both;transition:background .16s}
.mr-bd-row:last-child{border-bottom:none}
.mr-bd-row:hover{background:var(--row-hover)}
.mr-bd-ava{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;background:linear-gradient(145deg,#f6d873,#e0a91d);color:#4a3405}
.mr-bd-who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mr-bd-who b{font-size:12px;font-weight:700;line-height:1.3}
.mr-bd-who i{font-style:normal;font-size:10px;color:var(--faint);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mr-bd-btn{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:var(--ok-text);background:var(--ok-soft);border:1px solid rgba(52,211,153,.28);transition:all .18s}
.mr-bd-btn:hover{background:var(--ok);color:#fff;transform:scale(1.08)}

/* карточка победителя: связка с рейтингом */
.mr-win{width:100%;text-align:center;cursor:pointer}
.mr-win-score{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--line);width:100%}
.mr-win-score b{display:inline-flex;align-items:baseline;gap:4px;font-size:16px;font-weight:800;color:var(--ok-text);
  font-variant-numeric:tabular-nums}
.mr-win-score b i{font-style:normal;font-size:9px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.mr-win-score u{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:11px;font-weight:700;
  color:var(--muted);padding:2px 7px;border-radius:99px;background:var(--ok-soft)}
.mr-gal-empty{display:flex;align-items:center;gap:12px;padding:20px 18px;border-radius:var(--r);
  border:1px dashed var(--line);background:var(--surface-2);font-size:12px;line-height:1.55;color:var(--muted)}
.mr-gal-empty > span{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;background:var(--ok-soft);color:var(--ok-text)}
.mr-stat-v{animation:winIn .5s cubic-bezier(.22,1,.36,1) both}

/* раскрывающийся пункт бокового меню */
.subgrp{display:flex;flex-direction:column;gap:3px}
.sub.grp{cursor:pointer}
.sub.grp{width:100%;flex-shrink:0}
.sidebar.collapsed .subgrp{align-items:center}
.sidebar.collapsed .sub.grp{width:44px}
.subgrp{width:100%}
.subkids{width:100%}
.sub.grp.sel{color:var(--txt);font-weight:700}
.sub.grp.sel .dotico{background:var(--ok);color:#fff}
.subcar{margin-left:auto;display:flex;align-items:center;color:var(--faint);transition:transform .24s}
.subgrp.open .subcar{transform:rotate(90deg)}
.subkids{display:flex;flex-direction:column;gap:3px;padding-left:16px;position:relative;
  animation:subIn .24s cubic-bezier(.22,1,.36,1) both}
.subkids::before{content:"";position:absolute;left:22px;top:2px;bottom:6px;width:1px;background:var(--line)}
@keyframes subIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sub.kid{padding:8px 12px 8px 18px;font-size:12px}
.kiddot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--ok-text);opacity:.5;transition:all .22s}
.sub.kid.on .kiddot{background:#fff;opacity:1;transform:scale(1.2)}
/* =========================================================================
   ПОГОДА — стеклянная карточка
   ========================================================================= */
.mr-wx2{position:relative;overflow:hidden;border-radius:22px;isolation:isolate;
  background:linear-gradient(165deg,#101a1f 0%,#0b1418 55%,#0a1012 100%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 24px 50px -26px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.08)}
html:not(.dark) .mr-wx2{background:linear-gradient(165deg,#1d2b31 0%,#16232a 55%,#121d22 100%)}

.mr-wx2-b{position:absolute;border-radius:50%;pointer-events:none;filter:blur(38px);opacity:.75;z-index:0}
.mr-wx2-b.b1{width:190px;height:190px;left:-56px;top:-42px;background:#e88b2a;
  animation:wxDrift 15s ease-in-out infinite}
.mr-wx2-b.b2{width:210px;height:210px;right:-72px;top:96px;background:#1f6fb8;
  animation:wxDrift 19s ease-in-out infinite reverse}
.mr-wx2-b.b3{width:170px;height:170px;left:-40px;bottom:-58px;background:#14a260;
  animation:wxDrift 17s ease-in-out infinite}
@keyframes wxDrift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(16px,-18px,0) scale(1.12)}}
.mr-wx2-grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 32%,transparent 70%,rgba(0,0,0,.28))}

.mr-wx2-in{position:relative;z-index:2;display:flex;flex-direction:column;gap:13px;padding:18px 16px 16px;
  color:#fff;backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1)}

.mr-wx2-cap{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;letter-spacing:.02em;
  color:rgba(255,255,255,.62)}
.mr-wx2-cap i{width:6px;height:6px;border-radius:50%;background:#f5a623;box-shadow:0 0 8px #f5a623}

.mr-wx2-hero{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 6px}
.mr-wx2-hero .mr-sun{width:52px;height:52px;margin-bottom:6px}
.mr-wx2-deg{font-size:46px;font-weight:300;line-height:1;letter-spacing:-.035em;
  text-shadow:0 4px 22px rgba(0,0,0,.45)}
.mr-wx2-deg sup{font-size:17px;font-weight:400;top:-.75em;margin-left:2px;letter-spacing:0}
.mr-wx2-cond{font-size:12.5px;color:rgba(255,255,255,.7)}

.mr-wx2-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:11px 0;
  border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}
.mr-wx2-cell{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0;
  animation:winIn .5s cubic-bezier(.22,1,.36,1) both}
.mr-wx2-cell b{font-size:11.5px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mr-wx2-cell i{font-style:normal;font-size:9px;color:rgba(255,255,255,.5)}

.mr-wx2-days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mr-wx2-day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 3px 9px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  animation:winIn .5s cubic-bezier(.22,1,.36,1) both;transition:background .2s,transform .2s}
.mr-wx2-day:hover{background:rgba(255,255,255,.15);transform:translateY(-2px)}
.mr-wx2-day .mr-sun{width:26px;height:26px}
.mr-wx2-dn{font-size:8.5px;color:rgba(255,255,255,.6);text-align:center;line-height:1.2}
.mr-wx2-hi{font-size:13px;font-weight:700}
.mr-wx2-lo{font-size:10px;color:rgba(255,255,255,.5)}

.mr-wx2-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mr-wx2-tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 3px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  animation:winIn .5s cubic-bezier(.22,1,.36,1) both}
.mr-wx2-tile b{font-size:13px;font-weight:700;letter-spacing:-.01em}
.mr-wx2-tile i{font-style:normal;font-size:8.5px;color:rgba(255,255,255,.5);text-align:center;line-height:1.2}

@media(prefers-reduced-motion:reduce){.mr-wx2-b{animation:none}}

/* =========================================================================
   ГАЛЕРЕЯ ПОБЕДИТЕЛЕЙ — карточки призёров
   ========================================================================= */
.mr-gal-grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}

.mr-win{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:3px;width:100%;padding:30px 12px 13px;border-radius:16px;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);
  transition:transform .24s,border-color .24s,box-shadow .24s}
.mr-win:hover{transform:translateY(-5px)}

/* верхняя лента с местом */
.mr-win-rib{position:absolute;left:0;right:0;top:0;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:rgba(255,255,255,.72);background:rgba(255,255,255,.06)}
.mr-win.m1 .mr-win-rib{color:#4a3405;background:linear-gradient(100deg,#fbe9a4,#e0a91d)}
.mr-win.m2 .mr-win-rib{color:#2b3033;background:linear-gradient(100deg,#f2f5f7,#b7bfc4)}
.mr-win.m3 .mr-win-rib{color:#3d2609;background:linear-gradient(100deg,#f5d9bd,#c88742)}

/* мягкое свечение под лентой */
.mr-win-glow{position:absolute;left:50%;top:-46px;width:150px;height:110px;transform:translateX(-50%);
  border-radius:50%;pointer-events:none;filter:blur(22px);opacity:.55;background:var(--ok)}
.mr-win.m1 .mr-win-glow{background:#e0a91d;opacity:.75}
.mr-win.m2 .mr-win-glow{background:#c3cbd1}
.mr-win.m3 .mr-win-glow{background:#c88742}

/* блик по карточке лидера */
.mr-win-spark{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(104deg,transparent 34%,rgba(255,255,255,.16) 47%,rgba(255,255,255,.03) 54%,transparent 66%);
  background-size:240% 100%;animation:navSheen 5.5s ease-in-out infinite}

/* аватар */
.mr-win-ph{position:relative;width:66px;height:66px;margin:4px 0 8px;flex-shrink:0}
.mr-win-ava{position:absolute;inset:5px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;color:#fff;letter-spacing:.02em;
  background:linear-gradient(145deg,var(--brand-1),var(--brand-2));
  box-shadow:0 8px 20px -10px rgba(0,0,0,.85);transition:transform .24s}
.mr-win:hover .mr-win-ava{transform:scale(1.05)}
.mr-win-halo{position:absolute;inset:0;border-radius:50%;padding:2px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:haloSpin 6s linear infinite}
.mr-win.m1 .mr-win-halo{background:conic-gradient(from 0deg,#e0a91d,#fff6cf,#e0a91d,#8b6914,#e0a91d)}
.mr-win.m2 .mr-win-halo{background:conic-gradient(from 0deg,#b7bfc4,#ffffff,#b7bfc4,#7d7d7d,#b7bfc4)}
.mr-win.m3 .mr-win-halo{background:conic-gradient(from 0deg,#c88742,#f0cfae,#c88742,#8b5e2a,#c88742)}
@keyframes haloSpin{to{transform:rotate(360deg)}}
.mr-win-crown{position:absolute;left:50%;top:-11px;transform:translateX(-50%);color:#e0a91d;
  filter:drop-shadow(0 2px 5px rgba(224,169,29,.85));animation:crownFloat 2.6s ease-in-out infinite}
@keyframes crownFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
.mr-win-medal{position:absolute;right:-2px;bottom:-1px;width:23px;height:23px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;
  color:rgba(255,255,255,.8);background:var(--surface);border:2px solid var(--surface-2)}
.mr-win.m1 .mr-win-medal{color:#3a2a03;background:linear-gradient(145deg,#fbe9a4,#e0a91d)}
.mr-win.m2 .mr-win-medal{color:#2b3033;background:linear-gradient(145deg,#eef1f3,#b7bfc4)}
.mr-win.m3 .mr-win-medal{color:#3d2609;background:linear-gradient(145deg,#f0cfae,#c88742)}

.mr-win-fio{font-size:12.5px;font-weight:700;line-height:1.35}
.mr-win-post{font-size:10.5px;color:var(--muted);line-height:1.4}
.mr-win-dep{font-size:10px;font-weight:700;color:var(--ok-text);line-height:1.35;margin-top:2px}

/* доля от лидера */
.mr-win-bar{display:block;width:100%;height:5px;margin-top:10px;border-radius:99px;background:var(--track);overflow:hidden}
.mr-win-bar i{display:block;height:100%;border-radius:99px;transform-origin:left;
  background:linear-gradient(90deg,var(--ok),var(--brand-2));animation:growBar .8s cubic-bezier(.22,1,.36,1) both}
.mr-win.m1 .mr-win-bar i{background:linear-gradient(90deg,#fbe9a4,#e0a91d)}
.mr-win.m2 .mr-win-bar i{background:linear-gradient(90deg,#f2f5f7,#b7bfc4)}
.mr-win.m3 .mr-win-bar i{background:linear-gradient(90deg,#f5d9bd,#c88742)}

.mr-win-score{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:9px;padding-top:9px;
  border-top:1px solid var(--line)}
.mr-win-score b{display:inline-flex;align-items:baseline;gap:4px;font-size:17px;font-weight:800;color:var(--ok-text);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mr-win.m1 .mr-win-score b{color:#e0a91d}
.mr-win-score b i{font-style:normal;font-size:8.5px;font-weight:700;color:var(--faint);
  text-transform:uppercase;letter-spacing:.06em}
.mr-win-score u{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:11px;font-weight:700;
  color:var(--muted);padding:3px 8px;border-radius:99px;background:var(--ok-soft)}

/* акценты по местам */
.mr-win.m1{border-color:rgba(224,169,29,.45)}
.mr-win.m1:hover{box-shadow:0 22px 40px -20px rgba(224,169,29,.85)}
.mr-win.m2{border-color:rgba(183,191,196,.4)}
.mr-win.m2:hover{box-shadow:0 22px 40px -22px rgba(183,191,196,.7)}
.mr-win.m3{border-color:rgba(200,135,66,.4)}
.mr-win.m3:hover{box-shadow:0 22px 40px -22px rgba(200,135,66,.75)}
.mr-win:not(.top):hover{border-color:rgba(52,211,153,.45);box-shadow:0 20px 36px -20px rgba(16,185,129,.7)}

@media(prefers-reduced-motion:reduce){
  .mr-win-halo,.mr-win-crown,.mr-win-spark{animation:none}
}

.mr-gal-sub b{margin-left:auto;font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

/* переключатель периода в шапке галереи */
.mr-gal-tabs{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);flex-shrink:0}
.mr-gal-tabs .tab{color:rgba(255,255,255,.78)}
.mr-gal-tabs .tab:hover{color:#fff}
.mr-gal-tabs .tab.on{color:var(--brand-2)}
.mr-gal-tabs .tab.on::before{background:#fff}
.mr-gal + .mr-gal,.mr-gal + .card{margin-top:0}</style>

  var q = String(s).trim().split(/\s+/);
  var k = q.length >= 3 ? q[1] + " " + q[0] : String(s).trim();

function MR_loginErrorText(err) {
  if (!err) return "Не удалось войти. Попробуйте ещё раз.";
  if (err.kind === "auth" || err.status === 401) return "Неверный логин или пароль";
  if (err.status === 503) return "Авторизация временно недоступна. Обратитесь к администратору.";
  if (err.kind === "network") return "Не удалось подключиться к серверу.";
  if (err.kind === "forbidden" || err.status === 403) return "Доступ запрещён. Учётная запись отключена или недостаточно прав.";
  if (err.status === 400) return "Укажите логин и пароль.";
  return "Не удалось войти. Попробуйте ещё раз.";
}

/* ======================================================================

     "forbidden" — 403, токен цел, роли не хватает прав

  get: function () {

/* ---------- адаптеры ответов API к формату, который ждёт приложение ----------
   Меняем только форму данных на входе. MR_applyDir и MR_applyRating
   остаются как есть — их внутренняя логика не трогается. */

/* GET /api/employees -> items[] -> формат people из employees.json */
function MR_apiEmployeesToPeople(items) {
  return (items || []).map(function (e) {
    return {
      tnumber: e.tnumber || "",
      fio: e.fio,
      post: e.post,
      branch: e.branch,
      dep: e.dep,
      dept: e.dept,
      n: e.seed_badges || 0
    };
  });
}

/* GET /api/ratings -> items[] -> формат строк Рейтинг.json (русские ключи) */
function MR_apiRatingsToRows(items) {
  return (items || []).map(function (r) {
    var o = {};
    o.tnumber = r.tnumber || "";
    o["ФИО работника"] = r.fio || "";
    o["Суммарный балл за первый квартал"] = r.q1_points || 0;
    o["Суммарный балл за второй квартал"] = r.q2_points || 0;
    o["Суммарный балл за третий квартал"] = r.q3_points || 0;
    o["Суммарный балл за четвертый квартал"] = r.q4_points || 0;
    o["Балл за год"] = r.year_points || 0;
    o["Кол-во золотых бэйджев"] = r.gold_badges || 0;
    o["Кол-во серебряных бэйджев"] = r.silver_badges || 0;
    o["Кол-во бронзовых бэйджев"] = r.bronze_badges || 0;
    o["Кол-во зеленых бэйджев"] = r.green_badges || 0;
    o["Кол-во синих бэйджев"] = r.blue_badges || 0;
    o["Кол-во жёлтых бэйджев"] = r.yellow_badges || 0;
    return o;
  });
}

/* Постраничная выборка: у /employees в ответе есть total, у /ratings его нет,
   поэтому там идём, пока страница приходит полной. */
function MR_apiFetchAll(path, pageSize) {
  var size = pageSize || 200;
  var acc = [];
  function page(offset) {
    var sep = path.indexOf("?") >= 0 ? "&" : "?";
    return MR_api.get(path + sep + "limit=" + size + "&offset=" + offset).then(function (res) {
      var items = (res && res.items) || [];
      acc = acc.concat(items);
      var total = res && typeof res.total === "number" ? res.total : null;
      var more = total !== null ? acc.length < total : items.length === size;
      if (more && items.length) return page(offset + items.length);
      return acc;
    });
  }
  return page(0);
}

/* Перезагрузка справочников после входа.

   Справочники закрыты правами view и reports, поэтому при старте без токена
   приложение поднимается на файлах или встроенных данных. Как только вход
   выполнен, забираем те же данные из API и переприменяем их существующими
   MR_applyDir и MR_applyRating — новых адаптеров и второго клиента не заводим.

   Про гонку: форма входа рисуется внутри go(), то есть уже после того, как
   стартовая загрузка применила свои данные. Поэтому перезаписать свежие
   данные старыми стартовая цепочка не может. Флаг MR_dataGen оставлен
   страховкой на случай, если порядок когда-нибудь поменяют. */
var MR_dataGen = 0;

/* ---------- заявки из API ----------
   Серверный реестр держим отдельно от локального: localStorage до шага 5
   остаётся запасным хранилищем, и записывать в него ответы сервера нельзя —
   иначе первый же пустой ответ затёр бы всё, что человек создал локально.

   MR_SRV_REQS === null  — с сервера ещё не читали, работаем на localStorage
   MR_SRV_REQS === []    — сервер ответил, заявок там нет (сейчас именно так) */
var MR_SRV_REQS = null;

/* ISO-дата сервера -> формат, в котором даты лежат в записях приложения. */
function MR_apiDate(iso) {
  if (!iso) return "";
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  var p = function (n) { return (n < 10 ? "0" : "") + n; };
  return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear()
    + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

/* GET /api/requests -> items[] -> формат записи, который принимает MR_reqBase.
   Единственное место преобразования: дублировать его нигде не нужно. */
function MR_apiRequestsToRecords(items) {
  return (items || []).map(function (r) {
    return {
      id: r.request_no || ("ЗС-" + r.id),
      srvId: r.id,                       /* пригодится на шаге 5 для PATCH */
      status: r.status_ui_key || "pending",
      tnumber: r.tnumber || "",
      emp: r.employee_fio || "",
      post: r.employee_post || "",
      dept: r.employee_dept || "",
      initiator: r.initiator_login || "",
      date: MR_apiDate(r.created_at),
      comment: r.merit_text || r.comment || "",
      merit: r.merit_text || "",
      nomination: r.nomination || "",
      badge: r.nomination || "",
      doc: r.doc_name || null,
      cost: r.points || 0
    };
  });
}

/* Читает реестр с сервера. Ошибку наружу не гасит: вызывающий решает,
   показать сообщение или промолчать. */
function MR_loadRequests() {
  return MR_apiFetchAll("/requests").then(function (items) {
    MR_SRV_REQS = MR_apiRequestsToRecords(items);
    MR_VER++;
    console.log("Реестр заявок из API: " + MR_SRV_REQS.length);
    return MR_SRV_REQS.length;
  });
}

function MR_reloadDirectories() {
  var gen = ++MR_dataGen;
  return MR_apiFetchAll("/employees").then(function (items) {
    if (gen !== MR_dataGen) return false;
    /* users API не отдаёт — переносим текущие. Копия обязательна:
       MR_applyDir очищает MR_USERS перед заполнением. */
    MR_applyDir({ people: MR_apiEmployeesToPeople(items), users: MR_USERS.slice() });
    return MR_apiFetchAll("/ratings").then(function (rows) {
      if (gen !== MR_dataGen) return false;
      MR_applyRating(MR_apiRatingsToRows(rows));
      MR_VER++;   /* существующий счётчик: сбрасывает useMemo рейтинга и доски */
      /* Данные теперь из API — плашка про демонстрационные больше не верна. */
      var banner = document.querySelector(".mr-demo-banner");
      if (banner && banner.parentNode) banner.parentNode.removeChild(banner);
      console.log("После входа обновлено из API: " + MR_PEOPLE.length + " people, "
        + Object.keys(MR_RATING || {}).length + " записей рейтинга");
      return true;
    });
  });
}

/* 1) Основной источник — REST API. Требует токен: справочники закрыты
      правами view и reports, поэтому до входа их не отдадут. */
function fromApi(){
  if(!MR_token.has()) return Promise.reject(new Error("нет токена"));
  return MR_apiFetchAll("/employees").then(function(items){
    /* users API не отдаёт — оставляем те, что уже есть. Передаём копию:
       MR_applyDir очищает MR_USERS перед заполнением, и передача самого
       массива обнулила бы его. */
    var m = "API /employees: " + MR_applyDir({ people: MR_apiEmployeesToPeople(items), users: MR_USERS.slice() });
    return MR_apiFetchAll("/ratings").then(function(rows){
      var m2 = m + "; API /ratings: " + MR_applyRating(MR_apiRatingsToRows(rows)) + " записей";
      /* Реестр заявок не критичен для запуска: не смогли прочитать — идём дальше. */
      return MR_loadRequests().then(function(n){ return m2 + "; API /requests: " + n; })
                              .catch(function(){ return m2 + "; заявки из API не прочитаны"; });
    });
  });
}

/* 2) Запасной источник — те же JSON-файлы, что и раньше. */
function fromFiles(){
  return fetch("employees.json",{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(j){
      var m="employees.json: "+MR_applyDir(j);
      return fetch("Рейтинг.json",{cache:"no-store"})
        .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
        .then(function(rj){return m+"; Рейтинг.json: "+MR_applyRating(rj)+" записей"})
        .catch(function(){return m+"; Рейтинг.json не загружен — баллы демонстрационные"});
    });
}

try{
  fromApi()
    .then(function(m){ go(m); })
    .catch(function(){
      /* 3) API не ответил или входа ещё не было — работаем как прежде. */
      fromFiles()
        .then(function(m){ go(m+" (источник: файлы, API недоступен)",1); })
        .catch(function(){ go("встроенные данные",1); });
    });
