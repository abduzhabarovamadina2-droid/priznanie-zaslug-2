<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ClauseOS — Compliance &amp; Risk Management</title>
<style>
/* =========================================================================
   ClauseOS — self-contained stylesheet (no Tailwind, no external CSS)
   ========================================================================= */
:root{
  --brand-1:#14a260; --brand-2:#0d4530; --brand-3:#0f5c3c;
  --brand-glow:rgba(20,220,140,.35);
  --ok:#10b981;   --ok-soft:rgba(16,185,129,.10);  --ok-text:#059669;
  --warn:#f59e0b; --warn-soft:rgba(245,158,11,.10);--warn-text:#d97706;
  --bad:#ef4444;  --bad-soft:rgba(239,68,68,.10);  --bad-text:#dc2626;
  --info:#0ea5e9; --info-soft:rgba(14,165,233,.10);--info-text:#0284c7;
  --iris:#6366f1; --iris-soft:rgba(99,102,241,.10);--iris-text:#4f46e5;

  --bg:#f1f5f9; --surface:#fff; --surface-2:#f8fafc; --blur:none;
  --line:#e2e8f0; --line-soft:rgba(226,232,240,.7);
  --txt:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --field:rgba(241,245,249,.8); --field-line:#e2e8f0;
  --row-hover:#f8fafc; --track:#f1f5f9;
  --shadow:0 1px 2px rgba(15,23,42,.04);
  --ring-focus:rgba(20,162,96,.35); --scrim:rgba(15,23,42,.4);
  --r-lg:16px; --r:12px; --r-sm:8px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
}
html.dark{
  --bg:#07080a;
  --surface:rgba(15,23,42,.55); --surface-2:rgba(30,41,59,.40); --blur:blur(24px);
  --line:rgba(52,211,153,.10); --line-soft:rgba(52,211,153,.10);
  --txt:#fff; --muted:#94a3b8; --faint:#64748b;
  --field:rgba(30,41,59,.60); --field-line:rgba(52,211,153,.15);
  --row-hover:rgba(52,211,153,.05); --track:rgba(30,41,59,.8);
  --shadow:0 0 0 1px rgba(16,185,129,.05),0 24px 60px -24px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.6);
  --ok-text:#34d399; --warn-text:#fbbf24; --bad-text:#f87171;
  --info-text:#38bdf8; --iris-text:#a5b4fc;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--faint)}
option{background:var(--surface);color:var(--txt)}
html.dark option{background:#101a20;color:#fff}
svg{display:block}
table{border-collapse:collapse}

html.dark body{
  background:
    radial-gradient(1100px 560px at 18% -6%, rgba(16,80,54,.20), transparent 60%),
    radial-gradient(900px 520px at 88% 18%, rgba(15,60,45,.14), transparent 55%),
    radial-gradient(1000px 700px at 60% 110%, rgba(12,50,38,.16), transparent 60%),
    #07080a;
}
html.dark body::before{
  content:"";position:fixed;inset:0;z-index:0;opacity:.045;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
#root{position:relative;z-index:1}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.35);border-radius:8px}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
.noscroll::-webkit-scrollbar{display:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes navBreathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes navSheen{0%{background-position:140% 0}50%,100%{background-position:-40% 0}}
@keyframes navPulseRing{0%{transform:scale(.82);opacity:.9}70%,100%{transform:scale(1.38);opacity:0}}
@keyframes brandGlow{0%,100%{box-shadow:0 0 0 0 rgba(20,220,140,0),0 4px 14px rgba(0,0,0,.25)}50%{box-shadow:0 0 18px 3px var(--brand-glow),0 4px 14px rgba(0,0,0,.25)}}
.anim-fade{animation:fadeIn .35s ease both}
.anim-slide{animation:slideIn .3s cubic-bezier(.16,1,.3,1) both}
.anim-scale{animation:scaleIn .18s ease both}

/* =============================== LAYOUT =============================== */
.shell{display:flex;min-height:100vh}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.page{flex:1;width:100%;max-width:1600px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--faint)}
.crumbs b{color:var(--brand-1);font-weight:600}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.foot{text-align:center;font-size:11.5px;color:var(--faint);padding:8px 0 16px}

.card{background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-soft{background:var(--surface-2);backdrop-filter:var(--blur);border:1px solid var(--line-soft);border-radius:var(--r)}
.pad{padding:20px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}

/* =============================== SIDEBAR =============================== */
.sidebar{
  width:256px;flex-shrink:0;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;
  background:var(--surface);backdrop-filter:var(--blur);border-right:1px solid var(--line);
  transition:width .3s ease;z-index:20;
}
.sidebar.collapsed{width:76px}
/* кнопка сворачивания на границе панели */
.sb-toggle{
  position:absolute;right:-13px;top:44px;z-index:26;
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  background:var(--bg);border:1px solid var(--line);
  box-shadow:0 4px 12px -6px rgba(0,0,0,.5);
  transition:color .2s,background .2s,border-color .2s,transform .25s cubic-bezier(.2,.8,.25,1);
}
.sb-toggle:hover{color:var(--ok-text);border-color:rgba(52,211,153,.45);transform:scale(1.1)}
.sb-toggle:active{transform:scale(.94)}
.sb-toggle svg{transition:transform .3s cubic-bezier(.2,.8,.25,1)}
.sidebar.collapsed .sb-toggle svg{transform:rotate(180deg)}

/* ---- свёрнутая панель: всё по одной оси ---- */
.sidebar.collapsed .sidebar-head{padding:0;justify-content:center;gap:0}
.sidebar.collapsed .sidebar-nav{padding:16px 0;align-items:center}
.sidebar.collapsed .navgroup{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px}
.sidebar.collapsed .navhead{width:44px;padding:8px 0;justify-content:center;gap:0}
.sidebar.collapsed .subnav{width:100%;padding:6px 0 0;align-items:center;gap:6px}
.sidebar.collapsed .sub{width:44px;padding:8px 0;justify-content:center;gap:0;border-radius:12px}
.sidebar.collapsed .dotico{width:28px;height:28px;border-radius:9px}
.sidebar.collapsed .sidebar-foot{padding:12px 0;align-items:center}
.sidebar.collapsed .theme-toggle{width:44px;height:40px;padding:0;justify-content:center;gap:0}
.sidebar.collapsed .profile{width:44px;padding:6px 0;justify-content:center;gap:0}
html.dark .sb-toggle{background:#0d1512;box-shadow:0 4px 14px -6px rgba(0,0,0,.9)}
.sidebar-head{height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.logo-mark{
  width:32px;height:32px;border-radius:var(--r-sm);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(135deg,var(--brand-1),var(--brand-2));animation:brandGlow 3.2s ease-in-out infinite;
}
.logo-mark img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}
.logo-text{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.logo-word{font-size:13px;font-weight:800;letter-spacing:.03em;white-space:nowrap;line-height:1;text-transform:uppercase}
.logo-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;background:var(--ok-soft);color:var(--ok-text);line-height:1.2}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px}

/* раздел «Признание заслуг» */
/* без контура и подложки — только сами пункты */
.navgroup{position:relative}
.navhead{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 12px;border-radius:var(--r);text-align:left;cursor:pointer;
  font-size:13.5px;font-weight:700;color:var(--txt);
  transition:background .2s,color .2s;
}
.navhead:hover{background:var(--row-hover)}
.navhead.on{background:var(--ok-soft);color:var(--ok-text)}
.navico{
  width:28px;height:28px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--track);color:var(--muted);transition:all .25s;
}
.navgroup.active .navhead .navico{background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:#fff;box-shadow:0 4px 12px -4px rgba(10,92,64,.7)}
.navhead .lbl{flex:1;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subnav{display:flex;flex-direction:column;gap:3px;padding:2px 8px 8px}
.sub{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 12px;border-radius:10px;text-align:left;overflow:hidden;
  font-size:12.5px;font-weight:500;color:var(--muted);transition:all .22s;
}
.sub:hover{background:var(--row-hover);color:var(--txt)}
.sub.on{color:#fff;font-weight:700;background:linear-gradient(100deg,var(--brand-1),var(--brand-2));box-shadow:0 6px 18px -6px rgba(10,92,64,.75)}
.sub.on::after{
  content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 46%,transparent 62%);
  background-size:220% 100%;animation:navSheen 6s ease-in-out infinite;
}
.dotico{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ok-soft);color:var(--ok-text);transition:all .22s}
.sub.on .dotico{background:rgba(255,255,255,.24);color:#fff}
.sub .slbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sidebar-foot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.theme-toggle{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--muted);transition:background .2s}
.theme-toggle:hover{background:var(--row-hover)}
.switch{margin-left:auto;width:32px;height:18px;border-radius:99px;padding:2px;background:#cbd5e1;transition:background .2s;flex-shrink:0}
html.dark .switch{background:var(--ok)}
.switch i{display:block;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
html.dark .switch i{transform:translateX(14px)}
.profile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line-soft)}
.profile-av{width:32px;height:32px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--ok),var(--brand-2));box-shadow:0 0 0 1px rgba(52,211,153,.28)}
.user-ava{display:block;border-radius:50%;object-fit:cover;object-position:50% 50%;flex-shrink:0;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.35),0 2px 8px -2px rgba(0,0,0,.5)}
.profile-av .user-ava{box-shadow:none}
.profile-meta{min-width:0;flex:1}
.profile-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-role{font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ==================== GLASS FOREST-GREEN HERO ==================== */
/* без тёмной подложки — видна только скруглённая «таблетка» */
.topdock{position:sticky;top:0;z-index:30;flex-shrink:0;background:transparent;
  transition:background .28s ease,box-shadow .28s ease,backdrop-filter .28s ease}
.topdock.stuck{backdrop-filter:blur(20px) saturate(1.1);-webkit-backdrop-filter:blur(20px) saturate(1.1);
  background:linear-gradient(180deg,rgba(7,8,10,.97),rgba(7,8,10,.93));
  box-shadow:0 12px 26px -18px rgba(0,0,0,.95)}
html:not(.dark) .topdock.stuck{background:linear-gradient(180deg,rgba(241,245,249,.98),rgba(241,245,249,.94));
  box-shadow:0 12px 26px -18px rgba(15,40,30,.3)}
.hero-slot{padding:4px 24px;flex-shrink:0}
.hero-strip{position:relative;padding:0}
/* без overflow — иначе прямоугольная обрезка режет свечение и его углы торчат за скругление */
.glass-wrap{position:relative;max-width:1240px;margin:0 auto}
.glass-glow{position:absolute;inset:-5px;border-radius:99px;pointer-events:none;filter:blur(6px);background:radial-gradient(closest-side, rgba(20,220,140,.22), transparent 78%);animation:navBreathe 4.5s ease-in-out infinite}
.glass-bar{
  position:relative;border-radius:99px;overflow:hidden;height:56px;padding:0 14px;width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  background:linear-gradient(180deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 26%),
             linear-gradient(120deg,#0a2e20 0%,var(--brand-3) 32%,var(--brand-1) 58%,var(--brand-2) 100%);
  box-shadow:0 0 0 1.25px rgba(85,255,178,.42),0 0 12px 0 rgba(20,220,140,.3),
             0 0 24px 2px rgba(20,220,140,.14),0 10px 24px -12px rgba(0,0,0,.55),
             inset 0 1px 1px rgba(255,255,255,.35),inset 0 -12px 20px -14px rgba(0,0,0,.5);
  backdrop-filter:blur(10px);
}
.glass-bar::before{
  content:"";position:absolute;inset:0;border-radius:99px;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.16) 45%,rgba(255,255,255,.04) 52%,transparent 65%);
  background-size:220% 100%;animation:navSheen 7s ease-in-out infinite;
}
.glass-group{display:flex;align-items:center;gap:10px;flex-shrink:0}
.glass-group.g1{padding-right:16px}
.glass-group.g2{padding:0 16px}
.glass-group.g3{padding-left:16px}

/* ---- содержимое верхней панели ---- */
.gl-user{display:flex;align-items:center;gap:9px;flex-shrink:0;padding:0 10px 0 6px}
.gl-name{font-size:13.5px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:-.01em;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.gl-role{font-size:10px;font-weight:600;color:rgba(236,253,245,.72);white-space:nowrap;margin-top:1px}
.gl-tools{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding-right:4px}
.gl-lang{
  display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:99px;flex-shrink:0;
  font-size:12.5px;font-weight:500;letter-spacing:.02em;color:#fff;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  transition:background .2s,transform .15s;
}
.gl-lang:hover{background:rgba(255,255,255,.26)}
.gl-lang:active{transform:scale(.96)}
.gl-search{position:relative;flex:1;min-width:132px;max-width:290px}
.gl-search > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(236,253,245,.7)}
.gl-search input{
  width:100%;height:34px;padding:0 13px 0 34px;border-radius:99px;font-size:12.5px;color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);transition:background .2s,border-color .2s;
}
.gl-search input::placeholder{color:rgba(236,253,245,.62)}
.gl-search input:focus{outline:none;background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45)}
.gl-kb{
  display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;flex-shrink:0;
  font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);transition:background .2s,transform .15s;
}
.gl-kb:hover{background:rgba(255,255,255,.26)}
.gl-kb:active{transform:scale(.97)}
.gl-icon{
  position:relative;width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--brand-2);
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.96), rgba(255,255,255,.82) 55%, rgba(230,240,235,.76) 100%);
  box-shadow:0 4px 14px rgba(0,0,0,.3), inset 0 1px 2px rgba(255,255,255,.9), 0 0 0 1px rgba(255,255,255,.4);
  transition:transform .18s;
}
.gl-icon:hover{transform:translateY(-1.5px)}
/* вариант «как в нижнем тулбаре»: полупрозрачная кнопка + пульсирующее кольцо */
.gl-icon.ghost{
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:none;
  color:#fff;
}
.gl-icon.ghost:hover{background:rgba(255,255,255,.26);transform:translateY(-1.5px)}
.gl-dot{
  position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 3.5px;border-radius:99px;
  background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border:none;
  box-shadow:0 1px 4px rgba(0,0,0,.28);
}
.gl-out{margin-left:3px;flex-shrink:0}
.glass-divider{width:1.5px;align-self:stretch;margin:11px 6px;flex-shrink:0;background:linear-gradient(180deg,transparent,rgba(180,255,220,.55) 25%,rgba(180,255,220,.55) 75%,transparent);box-shadow:0 0 10px 1px rgba(120,255,190,.5)}
.glass-time{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.02em;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.glass-time.sm{font-size:22px}
.glass-title{font-size:19px;font-weight:700;color:#fff;letter-spacing:-.02em;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.glass-sub{font-size:11.5px;font-weight:600;color:rgba(236,253,245,.7);white-space:nowrap}
.glass-btn{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.96), rgba(255,255,255,.82) 55%, rgba(230,240,235,.76) 100%);
  box-shadow:0 4px 14px rgba(0,0,0,.3), inset 0 1px 2px rgba(255,255,255,.9), 0 0 0 1px rgba(255,255,255,.4);
  transition:transform .18s,box-shadow .18s;
}
.glass-btn:hover{transform:translateY(-1.5px)}
.pulse-ring::after{content:"";position:absolute;inset:-5px;border-radius:99px;pointer-events:none;border:2px solid rgba(120,255,190,.65);animation:navPulseRing 2.2s ease-out infinite}
.av-stack{position:relative;display:flex;align-items:center}
.av{border-radius:50%;overflow:hidden;flex-shrink:0;background:#e2e8f0;border:3px solid rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.av.peek{position:absolute;left:-26px;top:50%;transform:translateY(-50%);z-index:0;opacity:.9;-webkit-mask-image:linear-gradient(90deg,#000 42%,transparent 90%);mask-image:linear-gradient(90deg,#000 42%,transparent 90%)}
.av.z1{position:relative;z-index:1}
.av.z2{position:relative;z-index:2;margin-left:-20px}

/* =============================== TOOLBAR =============================== */
.toolbar{position:relative;z-index:1;border-bottom:1px solid var(--line)}
html:not(.dark) .toolbar{background:rgba(255,255,255,.85)}
.toolbar-row{height:56px;padding:0 24px;display:flex;align-items:center;gap:16px}
.head-actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}
/* ---- бегущая строка в тулбаре ---- */
.tb-marquee{
  flex:1;min-width:0;overflow:hidden;align-self:stretch;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 93%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 93%,transparent 100%);
}
.tbm-track{display:flex;width:max-content;will-change:transform;animation:tbmRun 68s linear infinite}
.tb-marquee:hover .tbm-track{animation-play-state:paused}
.tbm-run{display:flex;flex-shrink:0}
.tbm-item{
  position:relative;display:inline-flex;align-items:center;padding:0 26px;white-space:nowrap;
  font-size:12.5px;font-weight:500;letter-spacing:0;color:#0d3d2c;
}
.tbm-item::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--ok);opacity:.55;
}
html.dark .tbm-item{color:rgba(214,240,229,.72)}
html.dark .tbm-item::before{background:var(--ok-text);opacity:.5}
@keyframes tbmRun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tbm-track{animation:none}}
@media(max-width:820px){.tb-marquee{display:none}}
.search{position:relative;flex:1;max-width:420px}
.search > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:36px;padding:0 64px 0 36px;border-radius:var(--r-sm);font-size:13px;background:var(--field);border:1px solid var(--field-line);transition:box-shadow .2s,border-color .2s}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--ring-focus)}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:4px;color:var(--faint);background:var(--track)}
.pill-row{display:flex;align-items:center;gap:6px;flex:1;justify-content:center;overflow-x:auto}
.pill{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted);border:1px solid var(--line);transition:all .2s}
.pill:hover{background:var(--row-hover)}
.pill.on{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.3)}
.toolbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--muted);transition:background .2s}
.btn:hover{background:var(--row-hover)}
.btn.icon{width:36px;padding:0;justify-content:center;position:relative}
.btn.primary{border:none;color:#fff;padding:0 14px;background:linear-gradient(90deg,var(--ok),var(--brand-2));box-shadow:0 4px 12px rgba(16,185,129,.3)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.primary:active{transform:scale(.96)}
.dot-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--bad);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
html:not(.dark) .dot-badge{border-color:#fff}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);width:288px;z-index:30;padding:8px;border-radius:var(--r);background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:0 20px 40px -12px rgba(0,0,0,.35);transform-origin:top right}
html:not(.dark) .dropdown{background:#fff}
.dropdown h6{padding:6px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.dropdown .item{padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.dropdown .item:hover{background:var(--row-hover)}
.dropdown .item b{display:block;font-size:12.5px;font-weight:600}
.dropdown .item span{font-size:11px;color:var(--muted)}

/* =============================== KPI =============================== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.kpi-grid > .hint{display:flex;min-width:0;height:100%}
.kpi-grid > .hint > .kpi{flex:1;min-width:0;display:flex;flex-direction:column}
.kpi > .chip,.kpi > .legend,.kpi > .split-bar{align-self:flex-start;flex-shrink:0}
.kpi > .split-bar{align-self:stretch}
.kpi{position:relative;overflow:visible;padding:20px;border-radius:var(--r-lg);background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(0,0,0,.25)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.kpi-label{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi-icon{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-icon.g{background:var(--ok-soft);color:var(--ok)}
.kpi-icon.b{background:var(--info-soft);color:var(--info)}
.kpi-icon.r{background:var(--bad-soft);color:var(--bad)}
.kpi-icon.v{background:var(--iris-soft);color:var(--iris)}
.kpi-value{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.kpi-value small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi-value .pct{font-size:18px}
.gauge-wrap{position:relative;flex-shrink:0}
.gauge-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--brand-1)}
.chip{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:4px}
.chip.g{background:var(--ok-soft);color:var(--ok-text)}
.chip.r{background:var(--bad-soft);color:var(--bad-text)}
.legend{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.split-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--track);margin-top:12px}
.split-bar > div{transition:width 1.1s cubic-bezier(.4,0,.2,1) .25s}

/* =============================== ANALYTICS =============================== */
.analytics{display:grid;grid-template-columns:7fr 3fr;gap:20px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:700}
.card-sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.tabs{display:flex;align-items:center;gap:2px;padding:2px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line-soft)}
.tab{position:relative;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);transition:color .2s;z-index:1}
.tab:hover{color:var(--txt)}
.tab.on{color:#fff}
.tab.on::before{content:"";position:absolute;inset:0;border-radius:6px;z-index:-1;background:linear-gradient(90deg,var(--ok),var(--brand-2));animation:scaleIn .18s ease both}
.chart{position:relative;width:100%;height:224px;margin-top:12px;user-select:none}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .grid-line{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.chart .dot{stroke:var(--surface);stroke-width:1.5;transition:r .15s ease}
html:not(.dark) .chart .dot{stroke:#fff}
.tip{position:absolute;padding:6px 10px;border-radius:var(--r-sm);font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none;background:#0f172a;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3);transform:translate(-50%,-140%)}
html.dark .tip{background:#f1f5f9;color:#0f172a}
.months{display:flex;justify-content:space-between;padding:0 4px;margin-top:4px}
.months span{font-size:10.5px;font-weight:600;color:var(--faint)}
.chart-foot{display:flex;align-items:center;gap:20px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.chart-foot b{color:var(--txt)}
.trend-up{display:flex;align-items:center;gap:4px;margin-left:auto;font-weight:600;color:var(--ok-text)}
.rings{display:flex;justify-content:center;padding:8px 0}
.health-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.health-row{display:flex;align-items:center;gap:10px}
.health-row i{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:transform .2s}
.health-row:hover i{transform:scale(1.25)}
.health-row .nm{flex:1;font-size:12.5px;font-weight:500}
.health-row .st{font-size:11px;color:var(--faint)}
.health-row .pc{width:40px;text-align:right;font-size:13px;font-weight:800}


/* ============ ОЖИВЛЕНИЕ ГРАФИКОВ И ПОДСКАЗКИ ============ */
/* появление карточек KPI */
@keyframes kpiIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.kpi.in{animation:kpiIn .6s cubic-bezier(.2,.8,.25,1) backwards}
.kpi::after{
  content:"";position:absolute;inset:0;border-radius:var(--r-lg);pointer-events:none;opacity:0;
  background:radial-gradient(120px 80px at var(--mx,50%) 0%, rgba(20,220,140,.13), transparent 70%);
  transition:opacity .3s;
}
.kpi:hover::after{opacity:1}
.kpi-icon{transition:transform .35s cubic-bezier(.2,.8,.25,1), box-shadow .35s}
.kpi:hover .kpi-icon{transform:translateY(-2px) rotate(-6deg) scale(1.08)}
@keyframes alarmPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 0 6px rgba(239,68,68,.14)}}
.kpi-icon.alarm{animation:alarmPulse 2.6s ease-in-out infinite}

/* всплывающая подсказка-пояснение */
.hint{position:relative;display:block}
.hint-pop{
  position:absolute;left:50%;bottom:calc(100% + 12px);z-index:60;width:266px;
  transform:translate(-50%,8px) scale(.97);opacity:0;pointer-events:none;
  display:flex;flex-direction:column;gap:5px;padding:12px 14px;border-radius:12px;text-align:left;
  background:rgba(9,17,14,.94);backdrop-filter:blur(14px);
  border:1px solid rgba(85,255,178,.26);
  box-shadow:0 18px 40px -16px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.25),0 0 22px -6px rgba(20,220,140,.35);
  transition:opacity .22s ease,transform .28s cubic-bezier(.2,.8,.25,1);
}
.hint-pop.wide{width:300px}
.hint-pop b{font-size:12px;font-weight:800;color:#eafff5;letter-spacing:-.01em}
.hint-pop i{font-style:normal;font-size:11.5px;line-height:1.5;color:rgba(214,240,229,.82)}
.hint-pop::after{
  content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%) rotate(45deg);margin-top:-5px;
  width:10px;height:10px;background:rgba(9,17,14,.94);
  border-right:1px solid rgba(85,255,178,.26);border-bottom:1px solid rgba(85,255,178,.26);
}
html:not(.dark) .hint-pop{background:rgba(255,255,255,.97);border-color:rgba(20,162,96,.24);box-shadow:0 18px 40px -16px rgba(15,40,30,.3)}
html:not(.dark) .hint-pop b{color:#0d2e22}
html:not(.dark) .hint-pop i{color:#4a5b55}
html:not(.dark) .hint-pop::after{background:rgba(255,255,255,.97);border-color:rgba(20,162,96,.24)}
.hint:hover .hint-pop,.hint:focus-within .hint-pop{opacity:1;transform:translate(-50%,0) scale(1)}
/* первая карточка в ряду — подсказку прижимаем к левому краю, последнюю к правому */
.kpi-grid > .hint:first-child .hint-pop{left:0;transform:translate(0,8px) scale(.97)}
.kpi-grid > .hint:first-child:hover .hint-pop{transform:translate(0,0) scale(1)}
.kpi-grid > .hint:first-child .hint-pop::after{left:56px}
.kpi-grid > .hint:last-child .hint-pop{left:auto;right:0;transform:translate(0,8px) scale(.97)}
.kpi-grid > .hint:last-child:hover .hint-pop{transform:translate(0,0) scale(1)}
.kpi-grid > .hint:last-child .hint-pop::after{left:auto;right:56px}

/* линейный график */
@keyframes lineDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.chart .line-draw{stroke-dasharray:1;animation:lineDraw 1.5s cubic-bezier(.35,0,.2,1) forwards}
@keyframes areaIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chart .area-in{animation:areaIn 1s ease .45s backwards}
@keyframes dotPop{from{opacity:0;transform:scale(0)}60%{transform:scale(1.35)}to{opacity:1;transform:scale(1)}}
.chart .dot{stroke:var(--surface);stroke-width:1.5;transition:r .18s cubic-bezier(.2,.8,.25,1);transform-box:fill-box;transform-origin:center}
.chart .dot.pop{animation:dotPop .45s cubic-bezier(.2,.8,.25,1) backwards}
@keyframes haloPulse{0%{transform:scale(.55);opacity:.6}70%{transform:scale(2.8);opacity:0}100%{transform:scale(2.8);opacity:0}}
.chart .halo{transform-box:fill-box;transform-origin:center;animation:haloPulse 2.4s ease-out infinite;pointer-events:none}
.chart .comet{pointer-events:none;mix-blend-mode:screen}
.chart .guide{stroke-width:1.2;stroke-dasharray:3 4;opacity:.55}
.months span{transition:color .2s,transform .2s}
.months span.on{color:var(--txt);transform:translateY(-1px)}

/* расширенная подсказка на графике */
.tip.rich{
  white-space:normal;width:230px;padding:11px 13px;border-radius:12px;display:flex;flex-direction:column;gap:3px;
  transform:translate(-50%,calc(-100% - 16px));text-align:left;
  background:rgba(9,17,14,.95);color:#eafff5;backdrop-filter:blur(14px);
  border:1px solid rgba(85,255,178,.26);
  box-shadow:0 18px 40px -16px rgba(0,0,0,.75),0 0 22px -6px rgba(20,220,140,.3);
}
html.dark .tip.rich{background:rgba(9,17,14,.95);color:#eafff5}
html:not(.dark) .tip.rich{background:rgba(255,255,255,.97);color:#0d2e22;border-color:rgba(20,162,96,.24);box-shadow:0 18px 40px -16px rgba(15,40,30,.3)}
.tip.rich.below{transform:translate(-50%,18px)}
.tip.rich b{font-size:11.5px;font-weight:700;opacity:.8}
.tip.rich .tip-val{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tip.rich .tip-delta{font-size:11px;font-weight:700}
.tip.rich .tip-delta.up{color:#34d399}
.tip.rich .tip-delta.down{color:#f87171}
.tip.rich .tip-note{font-size:10.5px;line-height:1.45;opacity:.62;font-weight:500;margin-top:2px}
@keyframes tipIn{from{opacity:0}to{opacity:1}}
.tip.rich{animation:tipIn .16s ease both}
.ring-tip{animation:tipIn .16s ease both}

/* кольца по фреймворкам */
.rings{position:relative}
.ring circle{transition:opacity .22s,stroke-width .2s}
.ring.dim{opacity:.3}

.ring-tip{
  position:absolute;left:50%;top:calc(100% - 4px);transform:translateX(-50%);z-index:40;width:250px;
  display:flex;flex-direction:column;gap:5px;padding:12px 14px;border-radius:12px;pointer-events:none;text-align:left;
  background:rgba(9,17,14,.95);backdrop-filter:blur(14px);border:1px solid rgba(85,255,178,.26);
  box-shadow:0 18px 40px -16px rgba(0,0,0,.75),0 0 22px -6px rgba(20,220,140,.3);
}
html:not(.dark) .ring-tip{background:rgba(255,255,255,.97);border-color:rgba(20,162,96,.24);box-shadow:0 18px 40px -16px rgba(15,40,30,.3)}
.ring-tip b{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:#eafff5}
.ring-tip b i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ring-tip .rt-val{font-size:11.5px;font-weight:700;color:rgba(214,240,229,.9)}
.ring-tip .rt-note{font-size:11px;line-height:1.5;color:rgba(214,240,229,.7)}
html:not(.dark) .ring-tip b{color:#0d2e22}
html:not(.dark) .ring-tip .rt-val{color:#3d5249}
html:not(.dark) .ring-tip .rt-note{color:#5a6b64}

.health-row{position:relative;padding:2px 0;border-radius:8px;transition:opacity .2s,background .2s;cursor:default}
.health-row.dim{opacity:.38}
.health-row.on{background:var(--surface-2)}
.health-row .hbar{position:absolute;left:20px;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--track);overflow:hidden;opacity:0;transition:opacity .2s}
.health-row .hbar b{display:block;height:100%;border-radius:2px;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.health-row.on .hbar{opacity:1}

@media (prefers-reduced-motion: reduce){
  .kpi.in,.chart .line-draw,.chart .area-in,.chart .dot.pop{animation:none}
  .chart .halo,.chart .comet,.kpi-icon.alarm{display:none}
}


/* ============ ВСПЛЫВАЮЩЕЕ ОПИСАНИЕ БЕЙДЖА ============ */
.binfo{

  padding:18px 20px 20px;border-radius:16px;pointer-events:none;

.bi-for{margin-top:13px;font-size:12.5px;font-weight:600;color:rgba(214,240,229,.9)}

/* =============================== ЛИЧНЫЙ КАБИНЕТ =============================== */
.lk{display:flex;flex-direction:column;gap:20px}
.lk-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.95fr) minmax(0,1.1fr);gap:20px;align-items:stretch}
@keyframes lkIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lk-card,.lk-tabs-card{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px 24px}

/* ---- карточка профиля ---- */

}
.lk-profile::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(60,255,190,.5) 1px,transparent 1.4px);background-size:15px 15px;
  -webkit-mask-image:radial-gradient(110% 130% at 15% 0%,#000 0%,transparent 60%);

}
.lk-wm{position:absolute;right:-34px;bottom:-46px;opacity:.09;pointer-events:none;filter:saturate(0) brightness(2)}
.lk-hero-row{position:relative;z-index:1;display:flex;align-items:flex-start;gap:24px;width:100%;min-width:0}
.lk-ava-wrap{position:relative;flex-shrink:0;width:104px;height:104px;z-index:1}
.lk-ava-ring{
  position:absolute;inset:-7px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,#7df3bd,#14a260,#0a5a3e,#7df3bd);
  animation:lkSpin 7s linear infinite;opacity:.85;
}
.lk-ava-wrap::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:#0b452f}
@keyframes lkSpin{to{transform:rotate(360deg)}}
.lk-profile .lk-ava{position:relative;z-index:2;box-shadow:0 8px 24px -10px rgba(0,0,0,.7)}
.lk-who{position:relative;z-index:1;min-width:0}
.lk-name{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.lk-role{
  display:inline-block;margin-top:8px;padding:4px 11px;border-radius:99px;
  font-size:11.5px;font-weight:700;color:#eafff5;
  background:rgba(255,255,255,.14);border:1px solid rgba(190,255,225,.3);
}
.lk-dept{margin-top:10px;font-size:12.5px;line-height:1.5;color:rgba(214,248,232,.78);max-width:340px}
.lk-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(120,255,200,.16)}
.lk-meta > *{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:rgba(214,248,232,.8)}
.lk-meta a:hover{color:#7df3bd}
.lk-meta svg{color:#5ee6a8;flex-shrink:0}

/* ---- общие элементы карточек ---- */
.lk-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lk-cap{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.lk-cap.sm{display:block;margin-top:18px}
.lk-more{
  display:inline-flex;align-items:center;gap:4px;margin-top:auto;padding-top:14px;align-self:flex-end;
  font-size:12px;font-weight:700;color:var(--ok-text);transition:gap .2s,color .2s;
}
.lk-more:hover{gap:8px;color:var(--ok)}

/* ---- KPI ---- */
.lk-kpi{display:flex;flex-direction:column}
.lk-kpi-wrap{display:flex;flex-direction:column}
.lk-donut{position:relative;align-self:center;margin:14px 0 6px}
@keyframes kpiBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
.lk-donut svg{animation:kpiBreath 5s ease-in-out infinite}
.lk-donut.hovering svg{animation-play-state:paused}
.kseg{transition:opacity .22s}
.kseg.dim{opacity:.28}
.lk-donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.lk-donut-c b{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--txt);
  transition:color .25s;font-variant-numeric:tabular-nums}
.lk-donut-c b i{font-size:16px;font-style:normal;font-weight:700;color:var(--muted)}
.lk-donut-c span{margin-top:3px;font-size:10.5px;color:var(--faint);max-width:104px;text-align:center;line-height:1.3}

.lk-legend{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.lk-lg{
  display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:8px;
  font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;cursor:pointer;
  transition:background .2s,opacity .2s,color .2s;
}
.lk-lg:hover,.lk-lg.on{background:var(--row-hover);color:var(--txt)}
.lk-lg.dim{opacity:.4}
.lk-lg i{width:9px;height:9px;border-radius:3px;flex-shrink:0;transition:transform .22s}
.lk-lg.on i{transform:scale(1.35)}
.lk-lg b{margin-left:auto;color:var(--txt);font-size:12px;font-variant-numeric:tabular-nums}

.lk-kpi-tip{
  margin-top:8px;padding:0 11px;max-height:0;opacity:0;overflow:hidden;border-radius:11px;
  display:flex;flex-direction:column;gap:5px;
  background:var(--surface-2);border:1px solid transparent;
  transition:max-height .32s cubic-bezier(.2,.8,.25,1),opacity .24s,padding .28s,border-color .28s;
}
.lk-kpi-tip.show{max-height:150px;opacity:1;padding:11px;border-color:var(--line)}
.lk-kpi-tip b{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800}
.lk-kpi-tip b i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lk-kpi-tip span{font-size:11px;line-height:1.5;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.lk-donut svg{animation:none}}

/* ---- баллы и рейтинг ---- */
.lk-score{display:flex;flex-direction:column}
.lk-medal{flex-shrink:0;filter:drop-shadow(0 6px 14px rgba(10,120,80,.5));animation:lkFloat 4s ease-in-out infinite}
@keyframes lkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.lk-pts{display:flex;align-items:baseline;gap:9px;margin-top:6px}
.lk-pts b{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(96deg,#f0d67a,#c9a227);-webkit-background-clip:text;background-clip:text;color:transparent}
.lk-pts span{font-size:11.5px;color:var(--muted)}
.lk-rate{margin-top:9px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lk-rate-h,.lk-rate-r{display:grid;grid-template-columns:26px 1fr 46px;gap:10px;align-items:center;padding:7px 12px}
.lk-rate-h{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);background:var(--surface-2)}
.lk-rate-h span:last-child,.lk-rate-r .rp{text-align:right}
.lk-rate-r{font-size:12px;border-top:1px solid var(--line);transition:background .2s}
.lk-rate-r:hover{background:var(--row-hover)}
.lk-rate-r .rn{font-weight:800;color:var(--faint)}
.lk-rate-r .rf{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.lk-rate-r .rp{font-weight:800;color:var(--txt)}
.lk-rate-r.me{background:var(--ok-soft)}
.lk-rate-r.me .rn,.lk-rate-r.me .rf{color:var(--ok-text)}
.lk-rate-r.me .rf{font-weight:700}
.lk-rate-r.me .rp{color:var(--ok-text)}

/* ---- вкладки ---- */
.lk-tabs-card{padding:0}
.lk-tabs-bar{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.lk-tabs{display:flex;gap:4px;overflow-x:auto;scroll-behavior:smooth;flex:1;min-width:0}
.lk-tab{
  position:relative;flex-shrink:0;padding:9px 14px;border-radius:10px;white-space:nowrap;
  font-size:12.5px;font-weight:600;color:var(--muted);transition:color .2s,background .2s;
}
.lk-tab:hover{color:var(--txt);background:var(--row-hover)}
.lk-tab.on{color:#fff;background:linear-gradient(100deg,var(--brand-1),var(--brand-2));
  box-shadow:0 6px 16px -8px rgba(10,92,64,.8)}
.lk-arrow{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid var(--line);transition:all .2s;
}
.lk-arrow:hover{color:var(--ok-text);border-color:rgba(52,211,153,.4)}

.lk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;padding:20px 24px 24px}
.lk-col{display:flex;flex-direction:column}
.lk-field{
  display:grid;grid-template-columns:minmax(120px,168px) minmax(0,1fr);gap:16px;align-items:start;
  padding:11px 0;border-bottom:1px dashed var(--line);animation:lkIn .45s ease backwards;
}
.lk-col > .lk-field:last-child{border-bottom:none}
.lk-label{font-size:12px;font-weight:600;color:var(--muted)}
.lk-value{font-size:12.5px;line-height:1.5;color:var(--txt);word-break:break-word}
.lk-value.link{color:var(--ok-text)}
.lk-value.link:hover{text-decoration:underline}
.lk-val-row{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;color:var(--txt)}
.lk-masked{letter-spacing:.16em;color:var(--faint)}
.lk-eye{
  width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:var(--faint);transition:all .2s;
}
.lk-eye:hover{color:var(--ok-text);background:var(--ok-soft)}

.lk-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:56px 24px;text-align:center}
.lk-empty-ico{
  width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  color:var(--ok-text);background:var(--ok-soft);border:1px solid rgba(52,211,153,.2);
}
.lk-empty b{margin-top:4px;font-size:14px;font-weight:700}
.lk-empty span{font-size:12px;color:var(--muted);max-width:420px;line-height:1.55}

/* верхний блок пользователя — теперь кнопка */
.gl-user{cursor:pointer;border-radius:99px;text-align:left;transition:background .2s}
.gl-user > div{text-align:left}
.gl-user:hover{background:rgba(255,255,255,.12)}
.profile{width:100%;cursor:pointer;text-align:left;transition:background .2s,border-color .2s}
.profile:hover{background:var(--row-hover);border-color:rgba(52,211,153,.3)}

@media(max-width:1280px){.lk-top{grid-template-columns:1fr 1fr}.lk-profile{grid-column:1 / -1}}
@media(max-width:900px){.lk-top{grid-template-columns:1fr}.lk-grid{grid-template-columns:1fr;gap:0}}
@media(max-width:700px){.lk-profile{flex-direction:column;text-align:center;align-items:center}.lk-meta{justify-content:center}}

/* =============================== BADGES =============================== */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.tag.gdpr{color:var(--iris-text);background:var(--iris-soft);border-color:rgba(99,102,241,.2)}
.tag.soc2{color:var(--ok-text);background:var(--ok-soft);border-color:rgba(16,185,129,.2)}
.tag.iso{color:var(--info-text);background:var(--info-soft);border-color:rgba(14,165,233,.2)}
.tag.hipaa{color:var(--warn-text);background:var(--warn-soft);border-color:rgba(245,158,11,.2)}
.risk{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid transparent}
.risk i{width:6px;height:6px;border-radius:50%}
.risk.low{color:var(--ok-text);background:var(--ok-soft);border-color:rgba(16,185,129,.2)} .risk.low i{background:var(--ok)}
.risk.medium{color:var(--warn-text);background:var(--warn-soft);border-color:rgba(245,158,11,.2)} .risk.medium i{background:var(--warn)}
.risk.high{color:var(--bad-text);background:var(--bad-soft);border-color:rgba(239,68,68,.2)} .risk.high i{background:var(--bad)}
.status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status.ok{color:var(--ok-text);background:var(--ok-soft)} .status.ok i{background:var(--ok)}
.status.rev{color:var(--warn-text);background:var(--warn-soft)} .status.rev i{background:var(--warn)}
.status.bad{color:var(--bad-text);background:var(--bad-soft)} .status.bad i{background:var(--bad);animation:pulseSoft 1.8s ease-in-out infinite}
.avatar{border-radius:50%;flex-shrink:0;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;width:28px;height:28px;font-size:10px;box-shadow:0 0 0 2px var(--surface)}
html:not(.dark) .avatar{box-shadow:0 0 0 2px #fff}
.avatar.lg{width:40px;height:40px;font-size:13px}
.av-violet{background:#8b5cf6}.av-sky{background:#0ea5e9}.av-emerald{background:#10b981}
.av-rose{background:#f43f5e}.av-amber{background:#f59e0b}.av-indigo{background:#6366f1}.av-slate{background:#64748b}

/* =============================== TABLE =============================== */
.table-card{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
.table-head{padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.table-tools{display:flex;align-items:center;gap:8px}
.mini-search{position:relative}
.mini-search > svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.mini-search input{height:32px;width:224px;padding:0 12px 0 30px;border-radius:var(--r-sm);font-size:12px;background:var(--field);border:1px solid var(--field-line)}
.mini-search input::placeholder{color:var(--faint)}
.mini-search input:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--ring-focus)}
.btn.sm{height:32px;font-size:12px;padding:0 12px}
.table-scroll{overflow-x:auto}
table{width:100%;min-width:900px;text-align:left}
thead tr{background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
th{padding:10px 20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--row-hover)}
td{padding:14px 20px;vertical-align:middle}
.cell-id{font-family:var(--mono);font-size:12.5px;font-weight:700;transition:color .2s}
tbody tr:hover .cell-id{color:var(--brand-1)}
.cell-policy{font-size:12.5px;font-weight:500;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-owner{display:flex;align-items:center;gap:8px}
.cell-owner span{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.cell-date{font-size:12px;color:var(--muted);white-space:nowrap}
.row-actions{display:flex;align-items:center;gap:4px}
.act{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .2s}
.act:hover{background:var(--row-hover)}
.act.view:hover,.act.ok:hover{background:var(--ok-soft);color:var(--ok)}
.empty{padding:40px 20px;text-align:center;font-size:13px;color:var(--faint)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}
.pager-btns{display:flex;align-items:center;gap:6px}
.pg{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);border:1px solid transparent;transition:all .2s}
.pg.nav{border-color:var(--line)}
.pg:hover:not(:disabled){background:var(--row-hover)}
.pg:disabled{opacity:.35;cursor:not-allowed}
.pg.on{background:var(--ok);color:#fff}

/* =============================== DRAWER =============================== */
.scrim{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
.scrim-bg{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(4px)}
.drawer{position:relative;width:100%;max-width:448px;height:100%;display:flex;flex-direction:column;background:var(--surface);backdrop-filter:blur(24px);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.3)}
html:not(.dark) .drawer{background:#fff}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer-id{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.drawer-id b{font-family:var(--mono);font-size:13px;font-weight:700}
.drawer-title{font-size:16px;font-weight:700;line-height:1.35}
.drawer-body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:24px}
.sec-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.meter{width:100%;height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.meter i.low{background:var(--ok)}.meter i.medium{background:var(--warn)}.meter i.high{background:var(--bad)}
.prose{font-size:13px;line-height:1.65;color:var(--muted);margin-top:8px}
.factors{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.factors li{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.factors svg{flex-shrink:0;margin-top:2px}
.factors li.low svg{color:var(--ok)}.factors li.medium svg{color:var(--warn)}.factors li.high svg{color:var(--bad)}
.steps{margin-top:12px}
.step{display:flex;gap:12px}
.step-rail{display:flex;flex-direction:column;align-items:center}
.step-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--track);color:#fff}
.step-dot.done{background:var(--ok)}
.step-dot.fail{background:var(--bad)}
.step-line{width:2px;flex:1;min-height:18px;background:var(--track)}
.step-line.done{background:var(--ok)}
.step-txt{padding-bottom:16px;font-size:12.5px;font-weight:600;color:var(--faint)}
.step-txt.done{color:var(--txt)}
.owner-card{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line-soft)}
.owner-card .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner-card .rl{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stamp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.drawer-foot{display:flex;align-items:center;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
.btn.lg{height:40px;font-size:12.5px;font-weight:700;justify-content:center}
.btn.approve{flex:1;border:none;color:#fff;background:linear-gradient(90deg,var(--ok),#059669);box-shadow:0 4px 12px rgba(16,185,129,.25)}
.btn.approve:hover{filter:brightness(1.1)}

.toast{position:fixed;bottom:24px;right:24px;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r);font-size:12.5px;font-weight:600;background:#0f172a;color:#fff;box-shadow:0 20px 40px -12px rgba(0,0,0,.5)}
html.dark .toast{background:#f1f5f9;color:#0f172a}
.toast svg{color:#34d399}

/* панель сжимается по мере сужения экрана, ничего не вылезает за скругление */
@media (max-width:1180px){
  .gl-role{display:none}
  .gl-search{min-width:110px}
}
@media (max-width:1020px){
  .gl-kb span,.gl-kb{font-size:0}
  .gl-kb{padding:0 13px}
  .gl-kb svg{font-size:initial}
}
@media (max-width:880px){
  .gl-name{display:none}
  .gl-user{padding:0 8px}
}
@media (max-width:1280px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1100px){.analytics{grid-template-columns:1fr}.pill-row{display:none}}
@media (max-width:760px){
  .kpi-grid{grid-template-columns:1fr}
  .page{padding:16px}
  .hero-slot{padding:4px 16px}
  .toolbar-row{padding:0 16px}
  .btn .lbl{display:none}
}

/* =========================================================================
   О ПРОГРАММЕ
   ========================================================================= */
.about-hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:28px 32px;color:#fff;
  background:linear-gradient(100deg,#04241a 0%,#083a2a 34%,#0c5a41 66%,#0a4633 100%);
  box-shadow:0 16px 40px -20px rgba(4,36,26,.9);
}
.about-hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background-image:radial-gradient(rgba(60,255,190,.5) 1px, transparent 1.4px);background-size:15px 15px;
  -webkit-mask-image:radial-gradient(120% 150% at 88% 8%, #000 0%, transparent 65%);
  mask-image:radial-gradient(120% 150% at 88% 8%, #000 0%, transparent 65%);
}
.about-hero h2{position:relative;z-index:1;font-size:23px;font-weight:800;letter-spacing:-.02em}
.about-hero .tagline{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;margin-top:10px;
  padding:6px 14px;border-radius:99px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#eafff5;
}
.about-hero p{position:relative;z-index:1;margin-top:14px;font-size:13.5px;line-height:1.65;color:rgba(220,255,240,.8);max-width:720px}



/* обе колонки одной высоты — растягиваются по самой высокой */
/* ============ БЛОК «О ПРОГРАММЕ» — фото с текстом поверх ============ */
.about-photo{
  position:relative;overflow:hidden;border-radius:var(--r-lg);border:1px solid var(--line);
  background:linear-gradient(150deg,#0d4a36,#071c15);
  min-height:400px;display:flex;flex-direction:column;
}
.about-photo::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
  background-image:radial-gradient(rgba(60,255,190,.45) 1px, transparent 1.4px);background-size:16px 16px;
  -webkit-mask-image:radial-gradient(110% 130% at 20% 0%, #000 0%, transparent 62%);
  mask-image:radial-gradient(110% 130% at 20% 0%, #000 0%, transparent 62%);
}
.about-photo .ph-mark{
  position:relative;z-index:1;flex:0 0 auto;height:186px;padding-top:34px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;opacity:.72;
}
/* затемнение снизу вверх — до середины блока */
.ph-scrim{
  position:absolute;left:0;right:0;bottom:0;height:62%;z-index:2;pointer-events:none;
  background:linear-gradient(0deg,
    rgba(1,11,8,.985) 0%,
    rgba(1,11,8,.95) 24%,
    rgba(2,14,10,.84) 48%,
    rgba(2,16,11,.5) 72%,
    rgba(2,16,11,.18) 88%,
    rgba(2,16,11,0) 100%);
}
.ph-copy{position:relative;z-index:3;margin-top:auto;padding:0 32px 26px}
.ph-title{
  font-size:17px;font-weight:800;letter-spacing:-.015em;line-height:1.35;color:#fff;white-space:nowrap;
  padding-bottom:11px;margin-bottom:14px;border-bottom:1px solid rgba(120,255,200,.18);
  text-shadow:0 2px 12px rgba(0,20,12,.6);
}
.ph-slogan{font-size:16px;font-weight:700;color:#5ee6a8;white-space:nowrap}
.ph-list{
  list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.32fr) minmax(0,.98fr);gap:8px 26px;
}
.ph-list li{
  position:relative;padding-left:19px;
  font-size:11.5px;line-height:1.52;color:rgba(224,248,238,.86);
  text-shadow:0 1px 8px rgba(0,20,12,.5);
}
.ph-list li::before{
  content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:2px;
  background:linear-gradient(135deg,#7df3bd,#14a260);transform:rotate(45deg);
  box-shadow:0 0 10px rgba(20,220,140,.55);
}
.ph-list li b{color:#fff;font-weight:700}
@media(max-width:1080px){
  .ph-list{grid-template-columns:1fr;gap:14px}
  .about-photo{min-height:0}
  .about-photo .ph-mark{height:170px}
  .ph-scrim{height:70%}
}
@media(max-width:1080px){.ph-title,.ph-slogan{white-space:normal}}
@media(max-width:760px){.ph-copy{padding:0 20px 24px}.ph-title{font-size:16px}.ph-slogan{font-size:15px}}


.badges-head{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:700;margin-bottom:14px}
.badges-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--brand-1),transparent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.badge-card{
  position:relative;width:100%;height:346px;padding:0;border:none;background:none;
  perspective:1400px;cursor:pointer;display:block;
}
.badge-flip{
  position:relative;width:100%;height:100%;
  transition:transform .75s cubic-bezier(.2,.8,.2,1);
  transform-style:preserve-3d;
}
.badge-card.flipped .badge-flip{transform:rotateY(180deg)}
.badge-face{
  position:absolute;inset:0;border-radius:var(--r-lg);overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding:16px 14px 34px;text-align:center;
  border:1px solid rgba(52,211,153,.10);
  transition:border-color .25s,box-shadow .25s;
}
.badge-front{background:linear-gradient(180deg,#12241d 0%,#0a1512 100%)}
.badge-back{background:linear-gradient(180deg,#101d2a 0%,#080f16 100%);transform:rotateY(180deg)}
html:not(.dark) .badge-front{background:linear-gradient(180deg,#14322a 0%,#0a1c16 100%)}
html:not(.dark) .badge-back{background:linear-gradient(180deg,#122536 0%,#08121c 100%)}
.badge-card:hover .badge-face{border-color:rgba(52,211,153,.3);box-shadow:0 20px 40px -16px rgba(0,0,0,.7)}
.badge-tier{position:absolute;top:12px;left:14px;z-index:2;font-size:9px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.42)}
.badge-art{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.badge-svg{width:100%;max-width:190px;display:block}
.trophy-svg{width:100%;max-width:152px;display:block}
.badge-name{font-size:14px;font-weight:700;color:#fff;margin-top:6px}
.badge-desc{font-size:12px;color:rgba(255,255,255,.55);margin-top:3px;font-style:italic}
.flip-hint{
  position:absolute;bottom:10px;left:0;right:0;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(255,255,255,.3);display:flex;align-items:center;
  justify-content:center;gap:5px;transition:color .25s;
}
.badge-card:hover .flip-hint{color:rgba(52,211,153,.8)}
.badge-card .spark{transform-box:fill-box;transform-origin:center}
.badge-card:hover .spark{animation:spark 1.2s ease-in-out infinite}
.badge-card:hover .spark:nth-of-type(2){animation-delay:.2s}
.badge-card:hover .spark:nth-of-type(3){animation-delay:.4s}
.badge-card .brotate{transform-box:fill-box;transform-origin:center;transition:transform .8s cubic-bezier(.3,1,.4,1)}
.badge-card:hover .brotate{transform:rotate(22.5deg)}
.badge-card .bglow{opacity:0;transition:opacity .4s}
.badge-card:hover .bglow{opacity:1}
@keyframes spark{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.badge-flip{transition:none}}

@media(max-width:1180px){.about-grid{grid-template-columns:1fr}.badges{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.badges{grid-template-columns:1fr}}

/* пустое состояние подраздела */
.emptystate{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 28px}
.es-mark{
  width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  color:#fff;background:linear-gradient(135deg,var(--brand-1),var(--brand-2));

}
.es-title{font-size:16px;font-weight:700}
.es-text{margin-top:8px;max-width:520px;font-size:13px;line-height:1.65;color:var(--muted)}
.es-text b{color:var(--txt)}

/* =========================================================================
   ЗАСЛУГИ — выражение благодарности
   ========================================================================= */
.zh{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
/* подпись — мельче и обычным начертанием; акцент остаётся на цифре */
.points{display:flex;align-items:center;gap:11px;font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted)}
.points b{
  min-width:54px;height:38px;padding:0 14px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;
  color:#2a1f00;background:linear-gradient(135deg,#e8c85a,#c9a227);
  box-shadow:0 6px 18px -6px rgba(201,162,39,.6);
}
.tabcards-wrap{position:relative}
.tabcards{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;padding-top:16px}

/* ==== матовое стекло: папка ==== */
.tabcard{
  position:relative;height:120px;background:none;text-align:left;
  transition:transform .34s cubic-bezier(.2,.8,.25,1);
}
.tabcard:hover{transform:translateY(-5px)}
.tabcard:active{transform:translateY(-2px) scale(.995)}

/* листы, вложенные в папку */
.tc-stack{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none;z-index:0}
.tc-stack i{
  position:absolute;right:12px;display:block;height:26px;border-radius:12px 12px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.64));
  backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);
  border:1px solid rgba(255,255,255,.55);border-bottom:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
  transition:top .36s cubic-bezier(.2,.8,.25,1),right .36s cubic-bezier(.2,.8,.25,1);
}
.tc-stack i:nth-child(1){width:46%;top:6px}
.tc-stack i:nth-child(2){width:38%;top:-3px;right:24px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.4));border-color:rgba(255,255,255,.55)}
.tabcard:hover .tc-stack i:nth-child(1){top:1px}
.tabcard:hover .tc-stack i:nth-child(2){top:-11px;right:32px}

/* язычок папки */
.tc-tab{
  position:absolute;left:0;top:0;z-index:1;width:46%;height:26px;border-radius:14px 16px 0 0;
  background:linear-gradient(150deg,#52dfa6 0%,#2ab97e 55%,#169065 100%);
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(198,255,228,.26);border-bottom:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42);
  transition:background .3s,border-color .3s,box-shadow .3s;
}

/* лицевая панель папки */
.tc-body{
  position:absolute;left:0;right:0;top:18px;bottom:0;z-index:2;
  overflow:hidden;border-radius:4px 20px 20px 20px;padding:14px 16px;
  display:flex;flex-direction:column;justify-content:space-between;color:#f2fbf7;
  background:linear-gradient(142deg,#4fdda3 0%,#25b378 26%,#12855c 54%,#0a5a3e 78%,#063a28 100%);
  backdrop-filter:blur(26px) saturate(1.35);-webkit-backdrop-filter:blur(26px) saturate(1.35);
  border:1px solid rgba(198,255,228,.24);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.48),
    inset 0 -40px 60px -44px rgba(0,0,0,.5);
  transition:border-color .3s,box-shadow .34s ease,background .3s;
}
.tc-body::before{
  content:"";position:absolute;left:-14%;top:-90%;width:130%;height:150%;pointer-events:none;
  background:radial-gradient(50% 50% at 26% 62%,rgba(255,255,255,.22),transparent 72%);
}
.tabcard:hover .tc-body,.tabcard:hover .tc-tab{border-color:rgba(210,255,236,.42)}
.tabcard:hover .tc-body{
  background:linear-gradient(142deg,#63ecb4 0%,#2cc287 26%,#149467 54%,#0b6647 78%,#07452f 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -40px 60px -44px rgba(0,0,0,.4),
             0 26px 44px -20px rgba(0,24,14,.85),0 10px 20px -14px rgba(0,24,14,.7),
             0 0 30px -10px rgba(40,220,150,.42);
}
.tc-sheen{
  position:absolute;inset:0;pointer-events:none;border-radius:4px 20px 20px 20px;
  background:linear-gradient(104deg,transparent 36%,rgba(255,255,255,.14) 48%,transparent 60%);
  background-size:250% 100%;animation:navSheen 9s ease-in-out infinite;
}

.tc-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tc-ico{
  width:32px;height:32px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92);
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .32s cubic-bezier(.2,.8,.25,1),background .25s;
}
.tabcard:hover .tc-ico{transform:translateY(-1px) scale(1.06);background:rgba(255,255,255,.26)}
.tc-n{
  min-width:24px;height:22px;padding:0 8px;border-radius:99px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:rgba(255,255,255,.95);
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.36);
}
.tc-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.tc-title{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.005em;color:rgba(255,255,255,.96);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,20,12,.35)}
.tc-sub{font-size:10.5px;font-weight:400;line-height:1.2;color:rgba(255,255,255,.52);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* активная папка — тёплое матовое стекло */
.tabcard.on .tc-body{
  background:linear-gradient(142deg,#fdf0bb 0%,#f0d472 30%,#dcb43e 62%,#b98f1f 100%);
  border-color:rgba(255,238,180,.5);
  box-shadow:inset 0 1px 0 rgba(255,250,225,.7),inset 0 -40px 60px -44px rgba(60,40,0,.4);
}
.tabcard.on:hover .tc-body{
  box-shadow:inset 0 1px 0 rgba(255,250,225,.75),inset 0 -40px 60px -44px rgba(60,40,0,.35),
             0 26px 46px -20px rgba(30,20,0,.7),0 10px 20px -14px rgba(30,20,0,.55),
             0 0 34px -10px rgba(255,214,110,.5);
}
.tabcard.on .tc-tab{
  background:linear-gradient(150deg,#fcecb2 0%,#f1d570 55%,#dcb440 100%);
  border-color:rgba(255,238,180,.5);box-shadow:inset 0 1px 0 rgba(255,250,225,.65);
}
.tabcard.on .tc-stack i{
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,251,236,.7));
  border-color:rgba(255,255,255,.6);
}
.tabcard.on .tc-body::before{background:radial-gradient(50% 50% at 26% 62%,rgba(255,255,255,.34),transparent 72%)}
.tabcard.on .tc-ico{background:rgba(255,244,205,.26);border-color:rgba(255,240,190,.45);color:#fff6da}
.tabcard.on .tc-title{color:#fffaea}
.tabcard.on .tc-sub{color:rgba(255,246,214,.68)}
.tabcard.on .tc-n{background:rgba(255,246,214,.28);border-color:rgba(255,240,190,.5);color:#fffaea}

@media (prefers-reduced-motion: reduce){.tc-sheen{animation:none;opacity:.3}}

.empsearch{position:relative;max-width:540px}
.empsearch > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.empsearch input{
  width:100%;height:44px;padding:0 16px 0 42px;border-radius:var(--r);font-size:13.5px;
  background:var(--field);border:1px solid var(--field-line);transition:border-color .2s,box-shadow .2s;
}
.empsearch input::placeholder{color:var(--faint)}
.empsearch input:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--ring-focus)}
.dd{
  position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;max-height:320px;overflow-y:auto;
  border-radius:var(--r);background:var(--surface);border:1px solid var(--line);
  box-shadow:0 24px 50px -18px rgba(0,0,0,.6);backdrop-filter:blur(24px);
}
html:not(.dark) .dd{background:#fff}
.dd-item{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;transition:background .15s;text-align:left;width:100%}
.dd-item:hover{background:var(--row-hover)}
.dd-ava{width:34px;height:34px;border-radius:50%;flex-shrink:0;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#34d399,var(--brand-2))}
.dd-name{font-size:13px;font-weight:600;display:block}
.dd-dept{font-size:11.5px;color:var(--faint);margin-top:1px;display:block}
.dd-empty{padding:22px;text-align:center;font-size:13px;color:var(--faint)}

.btn-thank{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:99px;
  font-size:12px;font-weight:600;color:#fff;white-space:nowrap;

  box-shadow:0 4px 12px -4px rgba(16,185,129,.7);transition:transform .18s,filter .18s;
}
.btn-thank:hover{transform:translateY(-1.5px);filter:brightness(1.14)}
.btn-thank:active{transform:scale(.96)}
td.num{color:var(--faint);font-weight:600;width:56px}
td.dept{color:var(--muted);font-size:12.5px;max-width:420px}
td.strong{font-weight:600}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ok-text)}
th .sarr{display:inline-block;margin-left:5px;opacity:.5;font-size:10px}

/* модальное окно направления благодарности */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
.overlay-bg{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(5px)}
.modal{
  position:relative;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:var(--r-lg);
  background:var(--surface);backdrop-filter:blur(28px);border:1px solid var(--line);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.7);animation:modalIn .28s cubic-bezier(.16,1,.3,1) both;
}
html:not(.dark) .modal{background:#fff}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}

.m-ava{width:46px;height:46px;border-radius:50%;flex-shrink:0;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#34d399,var(--brand-2))}
.m-name{font-size:14.5px;font-weight:700}
.m-dept{font-size:12px;color:var(--faint);margin-top:2px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.fld select,.fld textarea{

.fld textarea::placeholder{color:var(--faint)}
.fld select{height:46px;cursor:pointer}
.fld textarea{min-height:104px;resize:vertical;line-height:1.55}
.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand-1);box-shadow:0 0 0 3px var(--ring-focus)}
.fld.err select,.fld.err textarea{border-color:var(--bad);box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.errmsg{font-size:11.5px;color:var(--bad-text);margin-top:6px;font-weight:600}
.cost{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);padding:12px 14px;border-radius:var(--r);background:var(--warn-soft)}

.modal-foot{padding:18px 24px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end}
.btn.go{height:42px;padding:0 20px;border:none;color:#fff;background:linear-gradient(100deg,var(--brand-1),var(--brand-2));box-shadow:0 6px 18px -6px rgba(16,185,129,.7)}
.btn.go:hover{filter:brightness(1.14)}
.btn.ghost{height:42px;padding:0 20px}

@media(max-width:1250px){.tabcards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.tabcards{grid-template-columns:repeat(2,1fr)}}

   СЧЁТЧИК БАЛЛОВ — тот же стиль, что у кнопки уведомлений

.points-chip:hover{background:rgba(201,162,39,.2);transform:translateY(-1.5px)}
html.dark .points-chip:hover{background:rgba(232,200,90,.2)}
