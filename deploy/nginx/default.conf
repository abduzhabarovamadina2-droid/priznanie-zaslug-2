server {
    listen       80;
    server_name  _;
    charset      utf-8;
    charset_types text/css application/javascript application/json;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- API: тот же домен, поэтому CORS не нужен ----
    location /api/ {
        proxy_pass         http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Справочники: всегда свежие ----
    location ~* \.json$ {
        add_header Cache-Control "no-store" always;
    }

    # ---- Прототип и настройки: не кэшируем, чтобы правки были видны сразу ----
    location ~* /(index\.html|config\.js)$ {
        add_header Cache-Control "no-store" always;
    }

    # ---- Фотографии ----
    location ~* \.(png|jpe?g|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
