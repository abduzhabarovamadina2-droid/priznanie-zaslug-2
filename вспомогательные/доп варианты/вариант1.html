<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Цифровое ядро НБРК — Признание заслуг</title>
<style>
/* =========================================================================
   ЦИФРОВОЕ ЯДРО НБРК — Признание заслуг
   Автономный стиль. Без фреймворков и внешних ресурсов.
   ========================================================================= */
:root{
  --brand:#12855f; --brand-d:#0a5c40; --brand-dd:#073d2b; --brand-l:#1aa87a;
  --glow:rgba(26,220,150,.35);
  --gold:#c9a227; --gold-l:#e8c85a;

  --ok:#12855f;   --ok-soft:rgba(18,133,95,.10);   --ok-text:#0d6b4c;
  --warn:#c9871a; --warn-soft:rgba(201,135,26,.10);--warn-text:#a06c10;
  --bad:#d64550;  --bad-soft:rgba(214,69,80,.10);  --bad-text:#b8323d;

  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f5f8f7; --blur:none;
  --line:#dde5e2; --txt:#12211c; --muted:#5d6d67; --faint:#8d9a95;
  --field:#f2f6f4; --row-hover:#f5f9f7; --track:#e8edeb;
  --shadow:0 1px 2px rgba(10,60,43,.05);
  --shadow-lg:0 12px 32px -12px rgba(10,60,43,.18);
  --scrim:rgba(10,35,26,.45);
  --r-lg:16px; --r:12px; --r-sm:8px;
  --font:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
}
html.dark{
  --bg:#070b09;
  --surface:rgba(14,30,24,.6); --surface-2:rgba(20,42,34,.5); --blur:blur(20px);
  --line:rgba(52,211,153,.12); --txt:#ffffff; --muted:#9db0a8; --faint:#6b7d76;
  --field:rgba(20,42,34,.6); --row-hover:rgba(52,211,153,.05); --track:rgba(30,55,45,.85);
  --shadow:0 0 0 1px rgba(18,133,95,.06),0 24px 60px -24px rgba(0,0,0,.75);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.65);
  --ok-text:#34d399; --warn-text:#e8b53d; --bad-text:#f2717b;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
table{border-collapse:collapse;width:100%}

html.dark body{
  background:
    radial-gradient(1100px 560px at 15% -8%, rgba(14,80,56,.22), transparent 60%),
    radial-gradient(900px 520px at 90% 15%, rgba(12,64,46,.15), transparent 55%),
    #070b09;
}
html.dark body::before{
  content:"";position:fixed;inset:0;z-index:0;opacity:.04;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
#root{position:relative;z-index:1}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,150,140,.35);border-radius:8px}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
.noscroll::-webkit-scrollbar{display:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ringPulse{0%{transform:scale(.85);opacity:.85}70%,100%{transform:scale(1.35);opacity:0}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(26,220,150,0)}50%{box-shadow:0 0 20px 3px var(--glow)}}
@keyframes sheen{0%{background-position:140% 0}55%,100%{background-position:-40% 0}}
@keyframes spark{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes expandIn{from{opacity:0;max-height:0}to{opacity:1;max-height:260px}}
.fade{animation:fadeIn .35s ease both}
.pop{animation:scaleIn .18s ease both}

/* =========================== TOP BAR =========================== */
.topbar{
  position:sticky;top:0;z-index:40;height:66px;display:flex;align-items:center;gap:16px;
  padding-right:24px;color:#fff;overflow:hidden;
  background:linear-gradient(100deg,#04241a 0%,#083a2a 38%,#0c5a41 68%,#0a4633 100%);
  box-shadow:0 2px 20px rgba(0,0,0,.35);
}
.topbar::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(rgba(60,255,190,.6) 1px, transparent 1.4px);background-size:14px 14px;
  -webkit-mask-image:radial-gradient(150% 190% at 30% -10%, #000 0%, transparent 60%);
  mask-image:radial-gradient(150% 190% at 30% -10%, #000 0%, transparent 60%);
}
.tb-brand{position:relative;z-index:1;width:256px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding-left:20px;height:100%;color:#fff;text-align:left;transition:opacity .2s}
.tb-brand:hover{opacity:.85}
.tb-name{font-size:13px;font-weight:800;line-height:1.25;text-transform:uppercase}
.tb-tools{position:relative;z-index:1;display:flex;align-items:center;gap:14px;margin-left:auto}
.tb-select{width:230px;height:34px;border-radius:6px;background:#fff;color:#3d4a45;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12.5px;border:1px solid rgba(0,0,0,.12)}
.tb-select span{flex:1;color:#7b8783}
.tb-btn{height:34px;padding:0 16px;border-radius:6px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);color:#fff;transition:background .2s}
.tb-btn:hover{background:rgba(255,255,255,.26)}
.tb-icon{position:relative;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);transition:background .2s}
.tb-icon:hover{background:rgba(255,255,255,.24)}
.tb-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--gold);color:#2a1f00;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #0a4633}
.tb-user{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600}
.tb-ava{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:#0a5c40;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.tb-lang{height:34px;min-width:74px;border-radius:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.tb-out{opacity:.85}.tb-out:hover{opacity:1}

/* =========================== SHELL / SIDEBAR =========================== */
.shell{display:flex;min-height:calc(100vh - 66px);align-items:flex-start}
.side{
  width:256px;flex-shrink:0;position:sticky;top:66px;height:calc(100vh - 66px);
  display:flex;flex-direction:column;overflow-y:auto;
  background:var(--surface);backdrop-filter:var(--blur);border-right:1px solid var(--line);
}
.side-nav{padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.nav{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 12px;border-radius:var(--r);text-align:left;
  font-size:13.5px;font-weight:500;color:var(--muted);transition:background .2s,color .2s;
}
.nav:hover{background:var(--row-hover);color:var(--txt)}
.nav.on{background:var(--ok-soft);color:var(--ok-text);font-weight:600}
.nav .lbl{flex:1;line-height:1.3}
.nav .chev{transition:transform .28s cubic-bezier(.4,0,.2,1);flex-shrink:0;opacity:.6}
.nav .chev.open{transform:rotate(180deg)}

/* — раздел «Признание заслуг»: стеклянный зелёный блок — */
.navgroup{
  position:relative;border-radius:var(--r);overflow:hidden;margin:2px 0 4px;
  border:1px solid transparent;transition:border-color .25s,box-shadow .25s;
}
.navgroup.active{
  border-color:rgba(26,168,122,.25);
  background:linear-gradient(180deg, rgba(18,133,95,.10), rgba(18,133,95,.03));
  box-shadow:0 6px 20px -12px rgba(10,92,64,.55);
}
html.dark .navgroup.active{background:linear-gradient(180deg, rgba(26,168,122,.13), rgba(18,133,95,.04))}
.navgroup > .nav{border-radius:var(--r)}
/* единственный раздел — заголовок статичный, не сворачивается */
.navhead{cursor:default;font-weight:700;color:var(--txt)}
.navhead:hover{background:transparent}
.navgroup.active > .nav{background:transparent;color:var(--ok-text);font-weight:700}
.navgroup.active > .nav .navico{
  background:linear-gradient(135deg,var(--brand-l),var(--brand-d));color:#fff;
  box-shadow:0 4px 12px -4px rgba(10,92,64,.7);
}
.navico{
  width:28px;height:28px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--track);color:var(--muted);transition:all .25s;
}
.nav:hover .navico{background:var(--ok-soft);color:var(--ok-text)}
.subnav{display:flex;flex-direction:column;gap:3px;padding:2px 8px 8px;overflow:hidden;animation:expandIn .28s ease both}
.sub{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 12px;border-radius:10px;text-align:left;
  font-size:12.5px;font-weight:500;color:var(--muted);transition:all .22s;
}
.sub:hover{background:var(--row-hover);color:var(--txt)}
.sub.on{
  color:#fff;font-weight:700;
  background:linear-gradient(100deg,var(--brand-l),var(--brand-d));
  box-shadow:0 6px 18px -6px rgba(10,92,64,.75);
}
.sub.on::after{
  content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 46%,transparent 62%);
  background-size:220% 100%;animation:sheen 6s ease-in-out infinite;
}
.dotico{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ok-soft);color:var(--ok-text);transition:all .22s}
.sub.on .dotico{background:rgba(255,255,255,.24);color:#fff}
.side-foot{margin-top:auto;padding:14px 16px 18px;font-size:10.5px;color:var(--faint);line-height:1.6;border-top:1px solid var(--line)}

/* =========================== PAGE =========================== */
.page{flex:1;min-width:0;padding:26px 30px 40px;display:flex;flex-direction:column;gap:22px;max-width:1700px}
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.card{background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pad{padding:22px}
.points{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800}
.points b{min-width:56px;height:38px;padding:0 14px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#2a1f00;background:linear-gradient(135deg,var(--gold-l),var(--gold));box-shadow:0 4px 14px rgba(201,162,39,.35)}

/* =========================== ГЛАВНАЯ =========================== */
.hero{
  position:relative;overflow:hidden;border-radius:22px;padding:22px 26px;
  background:radial-gradient(700px 220px at 20% 0%, rgba(20,60,42,.5), transparent 65%),
             radial-gradient(600px 200px at 85% 100%, rgba(15,70,48,.36), transparent 65%),#061410;
}
.hero::before{
  content:"";position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.gwrap{position:relative;overflow-x:auto}
.gglow{position:absolute;inset:-20px;border-radius:99px;pointer-events:none;filter:blur(12px);background:radial-gradient(closest-side, rgba(26,220,150,.26), transparent 72%);animation:breathe 4.5s ease-in-out infinite}
.gbar{
  position:relative;border-radius:99px;overflow:hidden;height:78px;padding:0 18px;
  width:max-content;min-width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:linear-gradient(180deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 26%),
             linear-gradient(120deg,#062b1f 0%,var(--brand-d) 34%,var(--brand-l) 62%,var(--brand-dd) 100%);
  box-shadow:0 0 0 1.5px rgba(85,255,178,.36),0 0 26px 4px rgba(26,220,150,.26),
             0 14px 32px -14px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.32),
             inset 0 -14px 22px -14px rgba(0,0,0,.5);
}
.gbar::before{
  content:"";position:absolute;inset:0;border-radius:99px;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.16) 45%,rgba(255,255,255,.04) 52%,transparent 65%);
  background-size:220% 100%;animation:sheen 7s ease-in-out infinite;
}
.ggroup{display:flex;align-items:center;gap:13px;flex-shrink:0;padding:0 14px}
.gdiv{width:1.5px;align-self:stretch;margin:14px 2px;flex-shrink:0;background:linear-gradient(180deg,transparent,rgba(180,255,220,.55) 25%,rgba(180,255,220,.55) 75%,transparent);box-shadow:0 0 10px 1px rgba(120,255,190,.5)}
.gbig{font-size:23px;font-weight:800;color:#fff;letter-spacing:-.02em;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.gsub{font-size:11.5px;font-weight:600;color:rgba(226,255,242,.72);white-space:nowrap;margin-top:1px}
.gbtn{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;color:var(--brand-d);
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.96), rgba(255,255,255,.82) 55%, rgba(228,240,234,.76) 100%);
  box-shadow:0 4px 14px rgba(0,0,0,.3), inset 0 1px 2px rgba(255,255,255,.9), 0 0 0 1px rgba(255,255,255,.4);transition:transform .18s;
}
.gbtn:hover{transform:translateY(-1.5px)}
.gbtn.ring::after{content:"";position:absolute;inset:-5px;border-radius:99px;pointer-events:none;border:2px solid rgba(120,255,190,.65);animation:ringPulse 2.2s ease-out infinite}
.gava{width:44px;height:44px;border-radius:50%;flex-shrink:0;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.9);background:linear-gradient(135deg,var(--brand-l),var(--brand-dd));box-shadow:0 5px 14px rgba(0,0,0,.35)}
.gava.s2{margin-left:-16px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.kpi{position:relative;overflow:hidden;padding:20px;border-radius:var(--r-lg);background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kpi-lbl{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.35}
.kpi-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-ico.g{background:var(--ok-soft);color:var(--ok)}
.kpi-ico.y{background:rgba(201,162,39,.12);color:var(--gold)}
.kpi-ico.b{background:rgba(87,183,232,.12);color:#3d9dd0}
.kpi-ico.v{background:rgba(47,191,126,.12);color:#2FBF7E}
.kpi-val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:12px}
.kpi-val small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi-note{font-size:12px;color:var(--muted);margin-top:6px}
.trendchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;margin-top:8px;background:var(--ok-soft);color:var(--ok-text)}
.bar2{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--track);margin-top:12px}
.gaugewrap{position:relative;flex-shrink:0}
.gaugenum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ok-text)}

.grid2{display:grid;grid-template-columns:7fr 4fr;gap:18px;align-items:start}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ctitle{font-size:15px;font-weight:700}
.csub{font-size:11.5px;color:var(--faint);margin-top:2px}
.chart{position:relative;width:100%;height:225px;margin-top:14px}
.chart svg{width:100%;height:100%;overflow:visible}
.gline{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.cdot{stroke:var(--surface);stroke-width:1.6;transition:r .15s}
html:not(.dark) .cdot{stroke:#fff}
.tip{position:absolute;padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:700;white-space:nowrap;pointer-events:none;background:#0a2b20;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35);transform:translate(-50%,-145%)}
.xaxis{display:flex;justify-content:space-between;padding:0 4px;margin-top:6px}
.xaxis span{font-size:10.5px;font-weight:600;color:var(--faint)}
.rings{display:flex;justify-content:center;padding:6px 0 12px}
.dist{display:flex;flex-direction:column;gap:9px}
.drow{display:flex;align-items:center;gap:10px}
.drow i{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:transform .2s}
.drow:hover i{transform:scale(1.3)}
.drow .n{flex:1;font-size:12.5px;font-weight:500}
.drow .v{width:34px;text-align:right;font-size:13px;font-weight:800}
.rank{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;background:var(--track);color:var(--muted)}
.rank.g1{background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#2a1f00}
.rank.g2{background:linear-gradient(135deg,#e2e6e4,#b9c2be);color:#2b332f}
.rank.g3{background:linear-gradient(135deg,#e4b183,#c07f42);color:#2e1a08}
.pts{font-weight:800;color:var(--ok-text);white-space:nowrap}

/* =========================== ЗАСЛУГИ =========================== */
.tabcards{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.tabcard{
  position:relative;overflow:hidden;height:88px;padding:16px 18px;border-radius:var(--r);
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;
  background:linear-gradient(160deg,var(--brand),var(--brand-d));
  box-shadow:0 6px 18px -8px rgba(10,60,43,.5);transition:transform .22s,box-shadow .22s;
}
.tabcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(10,60,43,.55)}
.tabcard.on{background:linear-gradient(160deg,var(--gold-l),var(--gold));color:#2a1f00;box-shadow:0 10px 26px -10px rgba(201,162,39,.7)}
.tabcard::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.22) 46%,transparent 62%);background-size:220% 100%;animation:sheen 7s ease-in-out infinite}
.tabcard .tc-title{font-size:14.5px;font-weight:700}
.tabcard .tc-n{position:absolute;top:12px;right:14px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--gold);color:#2a1f00;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.55)}
.tabcard.on .tc-n{background:#0a4633;color:#fff}

.flow{display:flex;align-items:center;padding:14px 18px;flex-wrap:wrap}
.fstep{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}
.fstep .fn{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--track);color:var(--faint);transition:all .3s}
.fstep .ft{font-size:12.5px;font-weight:600;color:var(--faint);transition:color .3s}
.fstep.on .fn{background:linear-gradient(135deg,var(--brand-l),var(--brand));color:#fff;animation:glowPulse 2.2s ease-in-out infinite}
.fstep.on .ft{color:var(--txt)}
.fstep.done .fn{background:var(--ok);color:#fff}
.fstep.done .ft{color:var(--muted)}
.fbar{flex:1;height:2px;background:var(--track);margin:0 12px;min-width:16px;border-radius:2px}
.fbar.done{background:var(--ok)}

.searchbox{position:relative;max-width:520px}
.searchbox > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.searchbox input{width:100%;height:44px;padding:0 16px 0 42px;border-radius:var(--r);font-size:13.5px;background:var(--field);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.searchbox input::placeholder{color:var(--faint)}
.searchbox input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,133,95,.16)}
.dd{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;max-height:330px;overflow-y:auto;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);backdrop-filter:blur(20px)}
html:not(.dark) .dd{background:#fff}
.dd-item{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;transition:background .15s;text-align:left;width:100%}
.dd-item:hover{background:var(--row-hover)}
.dd-ava{width:34px;height:34px;border-radius:50%;flex-shrink:0;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--brand-l),var(--brand-dd))}
.dd-name{font-size:13px;font-weight:600}
.dd-dept{font-size:11.5px;color:var(--faint);margin-top:1px}
.dd-empty{padding:22px;text-align:center;font-size:13px;color:var(--faint)}

.tablewrap{overflow-x:auto;border-radius:var(--r-lg)}
thead tr{background:var(--surface-2);border-bottom:1px solid var(--line)}
th{padding:13px 18px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ok-text)}
th .sarr{display:inline-block;margin-left:5px;opacity:.5;font-size:10px}
tbody tr{border-bottom:1px solid var(--line);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--row-hover)}
td{padding:14px 18px;font-size:13px;vertical-align:middle}
td.num{color:var(--faint);font-weight:600;width:56px}
td.dept{color:var(--muted);font-size:12.5px;max-width:420px}
td.strong{font-weight:600}
.faq-q{font-weight:600;width:34%;line-height:1.5}
.faq-a{color:var(--muted);line-height:1.6}
.empty{padding:48px 20px;text-align:center;color:var(--faint);font-size:13.5px}
.btn-thank{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;background:linear-gradient(100deg,var(--brand),var(--brand-d));box-shadow:0 4px 12px -4px rgba(18,133,95,.6);transition:transform .18s,filter .18s}
.btn-thank:hover{transform:translateY(-1.5px);filter:brightness(1.12)}
.btn-thank:active{transform:scale(.96)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chip.draft{background:var(--warn-soft);color:var(--warn-text)} .chip.draft i{background:var(--warn)}
.chip.sent{background:var(--ok-soft);color:var(--ok-text)} .chip.sent i{background:var(--ok)}

/* =========================== О ПРОГРАММЕ =========================== */
.about-hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:26px 30px;color:#fff;background:linear-gradient(100deg,#04241a 0%,#083a2a 36%,#0c5a41 66%,#0a4633 100%);box-shadow:0 14px 36px -18px rgba(4,36,26,.9)}
.about-hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(rgba(60,255,190,.5) 1px, transparent 1.4px);background-size:15px 15px;-webkit-mask-image:radial-gradient(120% 150% at 85% 10%, #000 0%, transparent 65%);mask-image:radial-gradient(120% 150% at 85% 10%, #000 0%, transparent 65%)}
.about-hero h2{position:relative;z-index:1;font-size:22px;font-weight:800;letter-spacing:-.02em}
.about-hero p{position:relative;z-index:1;margin-top:8px;font-size:13.5px;color:rgba(220,255,240,.82);max-width:760px;line-height:1.6}
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
.about-text{font-size:13.5px;line-height:1.75;color:var(--muted)}
.about-text b{color:var(--txt)}
.about-text ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.about-text li{position:relative;padding-left:22px}
.about-text li::before{content:"";position:absolute;left:0;top:8px;width:9px;height:9px;border-radius:2px;background:linear-gradient(135deg,var(--brand-l),var(--brand));transform:rotate(45deg)}
.photo{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:linear-gradient(150deg,#0d4a36,#0a3527);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;position:relative}
.photo .cap{position:absolute;bottom:0;left:0;right:0;padding:14px 16px;font-size:12px;color:rgba(230,255,245,.85);background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.badges-head{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:700;margin-bottom:14px}
.badges-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--brand),transparent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.badge-card{position:relative;overflow:hidden;padding:14px 14px 20px;border-radius:var(--r-lg);text-align:center;background:linear-gradient(180deg,#12241d 0%,#0a1512 100%);border:1px solid rgba(255,255,255,.07);transition:transform .25s,box-shadow .25s}
.badge-card:hover{transform:translateY(-6px);box-shadow:0 18px 36px -14px rgba(0,0,0,.6)}
.badge-tier{position:absolute;top:12px;left:14px;z-index:2;font-size:9px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.4)}
.badge-svg{width:100%;max-width:190px;margin:0 auto;display:block}
.badge-name{font-size:14px;font-weight:700;color:#fff;margin-top:6px}
.badge-desc{font-size:12px;color:rgba(255,255,255,.55);margin-top:3px;font-style:italic}
.badge-card .spark{transform-box:fill-box;transform-origin:center}
.badge-card:hover .spark{animation:spark 1.2s ease-in-out infinite}
.badge-card:hover .spark:nth-of-type(2){animation-delay:.2s}
.badge-card:hover .spark:nth-of-type(3){animation-delay:.4s}
.badge-card .brotate{transform-box:fill-box;transform-origin:center;transition:transform .8s cubic-bezier(.3,1,.4,1)}
.badge-card:hover .brotate{transform:rotate(22.5deg)}
.badge-card .bglow{opacity:0;transition:opacity .4s}
.badge-card:hover .bglow{opacity:1}

/* =========================== MODAL =========================== */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
.overlay-bg{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(5px)}
.modal{position:relative;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:var(--r-lg);background:var(--surface);backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 40px 90px -30px rgba(0,0,0,.6);animation:slideUp .28s cubic-bezier(.16,1,.3,1) both}
html:not(.dark) .modal{background:#fff}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
.modal-head h3{font-size:17px;font-weight:700}
.modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.m-emp{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.m-ava{width:46px;height:46px;border-radius:50%;flex-shrink:0;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--brand-l),var(--brand-dd))}
.m-name{font-size:14.5px;font-weight:700}
.m-dept{font-size:12px;color:var(--faint);margin-top:2px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}
.fld select,.fld textarea{width:100%;border-radius:var(--r);background:var(--field);border:1px solid var(--line);padding:12px 14px;font-size:13.5px;transition:border-color .2s,box-shadow .2s}
.fld select{height:46px;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238d9a95' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
.fld textarea{min-height:104px;resize:vertical;line-height:1.55}
.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,133,95,.16)}
.fld.err select,.fld.err textarea{border-color:var(--bad);box-shadow:0 0 0 3px rgba(214,69,80,.15)}
.errmsg{font-size:11.5px;color:var(--bad-text);margin-top:6px;font-weight:600}
.cost{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:12px 14px;border-radius:var(--r);background:var(--warn-soft)}
.cost b{color:var(--warn-text)}
.modal-foot{padding:18px 24px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end}
.btn{height:42px;padding:0 20px;border-radius:var(--r);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
.btn.ghost{border:1px solid var(--line);color:var(--muted)}
.btn.ghost:hover{background:var(--row-hover)}
.btn.go{color:#fff;background:linear-gradient(100deg,var(--brand),var(--brand-d));box-shadow:0 6px 18px -6px rgba(18,133,95,.7)}
.btn.go:hover{filter:brightness(1.12)}
.iconbtn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--faint);transition:all .2s}
.iconbtn:hover{background:var(--row-hover);color:var(--txt)}
.toast{position:fixed;bottom:26px;right:26px;z-index:80;display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:var(--r);font-size:13.5px;font-weight:600;color:#fff;background:linear-gradient(100deg,var(--brand),var(--brand-dd));box-shadow:0 20px 44px -14px rgba(0,0,0,.6);animation:slideUp .3s ease both}
.toast svg{color:#7ef2c0}

@media(max-width:1250px){
  .tabcards{grid-template-columns:repeat(3,1fr)}
  .about-grid,.grid2{grid-template-columns:1fr}
  .badges{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  .side{display:none}
  .tb-brand{width:auto}
  .tabcards{grid-template-columns:repeat(2,1fr)}
  .page{padding:18px}
  .badges,.kpis{grid-template-columns:1fr}
}
